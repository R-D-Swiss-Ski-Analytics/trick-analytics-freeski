<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4efed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Youth">
<link rel="manifest" href="manifest-youth.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-youth.png">
<link rel="icon" type="image/png" href="icons/icon-youth-192.png">
<title>Skills-Check Freeski</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<style>
/* Trick Analyses Nachwuchs — Aussehen nach dem Dashboard «Auswertung Wettkampfdaten» (Swiss-Ski CI). */
:root{
  --red:#E2001A; --char:#3E3E3F; --blue:#004877; --redd:#8B0E13; --cyan:#148FA0;
  --bg:#faf7f6; --paper:#ffffff; --ink:#2c2c2e; --muted:#6b6b70; --line:#e7e3e1; --soft:#f4efed;
  --green:#3E8E5A; --green-bg:#EAF4EE; --gold:#B08D1E; --gold-bg:#F8F1DC;
  --cblue:#396FA8; --cblue-bg:#E8F0F8; --cred:#D64545; --cred-bg:#FBE9E9;
  --teal:#1F9E93; --teal-bg:#E4F4F2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
[hidden]{display:none!important}

/* Header wie Wettkampfdaten-Dashboard */
header{position:relative;overflow:hidden;background:var(--soft);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;right:-12%;top:-60%;width:60%;height:240%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(226,0,26,.55),rgba(226,0,26,.12),transparent 70%);transform:rotate(8deg)}
.hd{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:30px 24px 22px;max-width:1180px;margin:0 auto}
h1{font-size:36px;font-weight:800;letter-spacing:-.5px;color:var(--char);margin:0;line-height:1.1}
h1 .dot{color:var(--red)}
.sub{margin-top:8px;font-size:16px;color:var(--muted);font-weight:500}
.brand{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.brand svg{width:150px;height:auto;display:block}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.who .chip{background:rgba(255,255,255,.85)}
.iconbtn{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:999px;height:34px;min-width:34px;padding:0 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--char);display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:#cfc8c5}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tabs{position:sticky;top:0;z-index:60;background:rgba(250,247,246,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab-btn{background:none;border:0;padding:15px 0 12px;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;position:relative}
.tab-btn.on{color:var(--char);border-bottom-color:var(--red)}
.tab-btn .cnt{display:inline-block;margin-left:6px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;letter-spacing:0;vertical-align:1px}
.demo-bar{background:var(--char);color:#fff;font-size:12px;text-align:center;padding:6px 12px}
.demo-bar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:2px 10px;margin-left:8px;cursor:pointer;font-size:12px}

main{padding:28px 0 80px}
.page{display:none}
.page.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--char);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.card h2 .rt{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:600}
.lead{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=date],input[type=email],input[type=password],input[type=number],textarea{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:15px;width:100%;outline:none;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
select:focus,input:focus,textarea:focus{border-color:var(--char)}
textarea{min-height:64px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.btn{border:1px solid var(--char);background:var(--char);color:#fff;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{opacity:.92}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:#fff;color:var(--char);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--char)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fff;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--char);color:#fff}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--char);background:#fff;white-space:nowrap}
.chip.green{background:var(--green-bg);border-color:transparent;color:var(--green)}
.chip.gold{background:var(--gold-bg);border-color:transparent;color:var(--gold)}
.chip.blue{background:var(--cblue-bg);border-color:transparent;color:var(--cblue)}
.chip.red{background:var(--cred-bg);border-color:transparent;color:var(--cred)}
.chip.teal{background:var(--teal-bg);border-color:transparent;color:var(--teal)}
.chip.dark{background:var(--char);border-color:var(--char);color:#fff}
.stars{letter-spacing:1px;color:var(--gold);font-size:14px;white-space:nowrap}
.stars .off{color:#d9d3d0}

/* Listen */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;color:var(--char)}
.item .m{font-size:12px;color:var(--muted);margin-top:2px}
.item .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}

/* Skills-Check */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:default}
.kpi.click{cursor:pointer}
.kpi.sel{border-color:var(--char);box-shadow:inset 0 0 0 1px var(--char)}
.kpi .k{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:800;color:var(--char);margin-top:4px;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600}
.bar{height:8px;background:#efebe9;border-radius:99px;overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--green)}
.bar .b-part{background:var(--gold)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;gap:10px;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--char);padding-bottom:6px;border-bottom:2px solid var(--char)}
.sec-h .rt{margin-left:auto;font-weight:700;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.sec-note{font-size:13px;color:var(--muted);margin:8px 0 2px}
.slot{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.slot .ic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.ic.done{background:var(--green);color:#fff}
.ic.partial{background:var(--gold-bg);color:var(--gold)}
.ic.pending{background:var(--cblue-bg);color:var(--cblue)}
.ic.goal{background:var(--soft);color:var(--muted)}
.ic.open{border:2px solid #dcd6d3}
.ic.na{background:#f3f1f0;color:#b5b0ad}
.slot .st{font-weight:600;color:var(--char);font-size:14px}
.slot .sm{font-size:12px;color:var(--muted);margin-top:1px}
.slot.na .st{color:#aaa4a1;text-decoration:line-through}
.slot .pts{font-weight:800;font-size:14px;color:var(--char);text-align:right;white-space:nowrap}
.rule{display:flex;gap:10px;align-items:center;font-size:13px;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ic{width:16px;height:16px;font-size:10px}

/* Formular */
.preview{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:13px}
.preview .lbl{font-size:17px;font-weight:800;color:var(--char);margin-bottom:6px}
.preview .chips{display:flex;gap:6px;flex-wrap:wrap}
.filebox{border:1.5px dashed #d4ccc9;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff}
.progress{height:6px;border-radius:99px;background:#eee;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}

/* Tabelle */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 8px;border-bottom:2px solid var(--char);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#fbf9f8}
.tbl select{padding:5px 8px;font-size:13px;width:auto}
.name-in{border-color:transparent!important;background:transparent!important;font-weight:700;padding:4px 6px!important;min-width:150px}
.mail-in{font-weight:500;font-size:12px!important;color:var(--muted);margin-top:2px}
.name-in:hover,.name-in:focus{border-color:var(--line)!important;background:#fff!important}
.tbl .num{text-align:right;white-space:nowrap}
.minibar{width:90px;height:6px;background:#efebe9;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.minibar i{display:block;height:100%;background:var(--green)}
.scroll-x{overflow-x:auto}

/* Modal, Toast, Dropdown */
.modal-bg{position:fixed;inset:0;background:rgba(30,28,28,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 4px;font-size:22px;font-weight:800;color:var(--char)}
.modal video{width:100%;max-height:60vh;background:#111;border-radius:10px;margin:12px 0}
.crit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.crit .tog{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer;color:#cfc8c5}
.crit .tog.yes{background:var(--green);border-color:var(--green);color:#fff}
.crit .tog.no{background:var(--cred-bg);border-color:var(--cred);color:var(--cred)}
.crit .cn{font-weight:800;color:var(--char)}
.crit ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.score-big{font-size:34px;font-weight:800;color:var(--char)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--char);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:300;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.dropdown{position:absolute;right:24px;top:100%;margin-top:6px;width:360px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);z-index:150;max-height:70vh;overflow-y:auto}
.dropdown .n{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.dropdown .n:hover{background:#fbf9f8}
.dropdown .n.unread{border-left:3px solid var(--red)}
.dropdown .n .d{font-size:11px;color:var(--muted);margin-top:2px}

/* Login */
.gate{min-height:100vh;display:flex;flex-direction:column}
.gate .box{max-width:420px;width:100%;margin:40px auto;padding:0 16px}
.demo-users{display:grid;gap:10px}
.demo-user{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer}
.demo-user:hover{border-color:var(--char)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--char);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.avatar.r-coach{background:var(--blue)}
.avatar.r-dvlp{background:var(--red)}

/* Assessment wie Freeski-App */
.card-title{font-size:18px;font-weight:800;color:var(--char);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-group > label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.lbl-hint{font-size:10px;font-weight:400;text-transform:none;letter-spacing:0}
.section-divider{font-size:11px;color:var(--muted);letter-spacing:.5px;font-weight:800;text-transform:uppercase;margin:16px 0 4px;display:flex;align-items:center;gap:8px;grid-column:1/-1}
.section-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.grabchips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.gchip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--char);cursor:pointer}
.gchip.on{background:var(--green);border-color:var(--green);color:#fff}
.sb-form-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn-mastered,.btn-goal{color:#fff;border:none;border-radius:8px;padding:14px;font-size:16px;font-weight:800;letter-spacing:.5px;cursor:pointer}
.btn-mastered{background:linear-gradient(135deg,#2c6a42,#3E8E5A)}
.btn-goal{background:linear-gradient(135deg,#a6561a,#e08a3c)}
.btn-mastered:hover,.btn-goal:hover{opacity:.92}
.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--char);border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn-secondary:hover{border-color:var(--char)}
.btn.xs{padding:4px 10px;font-size:12px;border-radius:6px}
.ath-lbl{font-size:15px;font-weight:800;letter-spacing:.5px;color:var(--char)}
.sb-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sb-ov-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sb-ov-num{font-size:32px;font-weight:800;line-height:1}
.sb-ov-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;font-weight:700}
.sb-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sb-col-header{font-size:14px;font-weight:800;letter-spacing:.5px;padding:10px 14px;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:8px}
.sb-col-header.mastered{background:var(--green-bg);color:var(--green);border:1px solid var(--green);border-bottom:none}
.sb-col-header.goal{background:#FAEEDF;color:#C96A1F;border:1px solid #C96A1F;border-bottom:none}
.sb-col-body{border-radius:0 0 8px 8px;min-height:80px;border:1px solid var(--line);background:var(--paper)}
.sb-col-body.mastered{border-color:var(--green)}
.sb-col-body.goal{border-color:#C96A1F}
.dir-group{border-bottom:1px solid var(--line)}
.dir-group:last-child{border-bottom:none}
.dir-h{padding:6px 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;background:#fbf9f8}
.sb-trick-row{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.dir-h + .sb-trick-row{border-top:none}
.sb-trick-name{flex:1;min-width:0}
.icon-btn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;padding:3px 7px;font-size:11px}
.icon-btn.del:hover{border-color:var(--red);color:var(--red)}

/* Session-Bewertung wie Snowboard */
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{padding:24px 4px;border-radius:12px;border:2px solid;font-weight:800;font-size:15px;letter-spacing:1px;cursor:pointer;line-height:1.5}
.bigbtn.fail{border-color:var(--red);color:var(--red);background:rgba(226,0,26,.07)}
.bigbtn.land{border-color:var(--green);color:var(--green);background:rgba(62,142,90,.08)}
.bigbtn.fail.on{background:rgba(226,0,26,.2)}
.bigbtn.land.on{background:rgba(62,142,90,.22)}
.disclose{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.critstars{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:10px}
.critstar{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.critstar .st{font-size:24px;filter:grayscale(1);opacity:.35}
.critstar .nm{font-size:11px;line-height:1.25;font-weight:700;color:var(--muted);text-align:center}
.critstar.on{border-color:var(--cyan);background:#eef8f9}
.critstar.on .st{filter:none;opacity:1}
.critstar.on .nm{color:var(--cyan)}
.failchips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.failchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--char);cursor:pointer}
.failchip.on{border-color:var(--red);background:rgba(226,0,26,.12);color:var(--red)}
.failchip.add{border:1px dashed var(--cyan);color:var(--cyan)}
.btn.land{background:var(--green);border-color:var(--green)}
.btn.stomp{background:var(--cyan);border-color:var(--cyan)}
.statbox{text-align:center;padding:4px 10px;border-left:1px solid var(--line)}
.statbox b{display:block;font-size:18px;color:var(--char)}
.statbox span{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.dot-o{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px}
.dot-o.failed{background:var(--red)}.dot-o.landed{background:var(--green)}.dot-o.stomped{background:var(--cyan)}

/* Session-Ergänzungen wie Freeski */
.gsel{width:auto;padding:6px 10px;font-size:13px;border-radius:8px}
.run-el{padding:8px 0;border-top:1px solid var(--line)}
.run-el:first-child{border-top:0}
.run-no{width:22px;text-align:center;color:var(--muted)}
.rbtn{width:36px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;flex-shrink:0}
.rbtn.f.on{background:var(--red);border-color:var(--red);color:#fff}
.rbtn.l.on{background:var(--green);border-color:var(--green);color:#fff}
.rbtn.s.on{background:var(--cyan);border-color:var(--cyan);color:#fff}
.contest-row{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}

.rc-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.tl-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tl-row:first-of-type{border-top:0}
/* Monitoring (wie Snowboard) */
.mon-head .mon-title{font-size:21px;font-weight:800;color:var(--char)}
.typechips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.typechip{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer}
.typechip.on{border-color:var(--cyan);background:#e6f4f6;color:var(--cyan)}
.sec-lbl{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--char);margin:20px 0 10px}
.mon-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mon-tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.mon-tile:hover,.mon-card:hover{border-color:#cfc8c5;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.mon-tile .t,.mon-card .t{font-weight:700;color:var(--char);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar.sm{width:34px;height:34px;font-size:12px;background:#e6f4f6;color:var(--cyan)}
.ringwrap{position:relative;width:92px;height:92px;margin:14px auto 10px}
.ringlbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringlbl b{font-size:17px;font-weight:800;color:var(--char)}
.ringlbl span{font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tri{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:8px;text-align:center}
.tri b{display:block;font-size:15px;font-weight:800}
.tri span{font-size:9.5px;color:var(--muted)}
.mon-tile .more{text-align:center;font-size:11px;color:var(--cyan);font-weight:700;margin-top:8px}
.mon-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mon-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer}
.mon-card.is-crit{border-color:rgba(214,69,69,.5)}
.mon-card .big{font-size:26px;font-weight:800;line-height:1}
.mon-card .mini{font-size:10.5px;line-height:1.6;color:var(--muted)}
.dirbox{background:var(--soft);border-radius:12px;padding:14px;margin-top:14px}
.dirbar{height:12px;border-radius:99px;overflow:hidden;display:flex;background:#e7e3e1}
.dirbar i{display:block;height:100%}
.pill{display:inline-block;border:1px solid;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:700;background:#fff}
.legtbl{font-size:13px;border-collapse:collapse;min-width:260px}
.legtbl td{padding:4px 10px 4px 0}
.legtbl tr.bb td{border-bottom:1px solid var(--line);padding-bottom:8px}
.legtbl tr.bb + tr td{padding-top:8px}
.sq{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ln{display:inline-block;width:18px;height:2px;margin-right:6px;vertical-align:3px}
.ln.dash{height:0;border-top:2px dashed}
.sub-h{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--char);margin:18px 0 8px;display:flex;gap:10px}
.sub-h .rt{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.varrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
.coach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 24px}

/* Session / Reports / Monitoring */
.f-lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:10px}
.linkbtn{background:none;border:0;color:var(--red);font-weight:700;font-size:12px;cursor:pointer;letter-spacing:0;text-transform:none;padding:0}
.athchips,.trickchips{display:flex;gap:8px;flex-wrap:wrap}
.athchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--char);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.athchip small{font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:99px;padding:1px 7px}
.athchip.on{background:var(--char);border-color:var(--char);color:#fff}

.tchip.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#fff6f6}
.tchip.add{border-style:dashed;color:var(--muted)}

.sess-title{font-size:22px;font-weight:800;color:var(--char);display:flex;align-items:center;gap:10px}
.critgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.critbtn{border:2px solid var(--green);background:var(--green-bg);color:var(--green);border-radius:12px;padding:14px 12px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;min-height:62px}
.critbtn span{font-size:22px;width:26px;text-align:center}
.critbtn.no{border-color:var(--cred);background:var(--cred-bg);color:var(--cred)}
.btn.big{padding:15px 22px;font-size:16px;flex:1;min-width:180px}
.item.click{cursor:pointer}

.chart{overflow-x:auto;margin-top:8px}

.trick-block{padding:14px 0;border-top:1px solid var(--line)}

details summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}

.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════
   KONFIGURATION
   Projekt «Trick Analyses Youth» (Org Swiss-Ski Freestyle). Leere SUPABASE_URL = Demo-Modus.
   Mit ?demo in der URL wird auch bei gesetzter URL der Demo-Modus erzwungen.
   ══════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://yoeqjlonyyuwrojvlcqm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oLwde7BCOv-KpTHegncZTQ_-gMz_otw';
const VIDEO_BUCKET = 'skills-videos';
const DEMO = !SUPABASE_URL || new URLSearchParams(location.search).has('demo');
const DEMO_KEY = 'nw-demo-v6';

/* ══════════════════════════════════════════════════════════════════════
   TRICK-VOKABULAR
   ══════════════════════════════════════════════════════════════════════ */
const DIRN = {L:'Left', R:'Right', SL:'Switch Left', SR:'Switch Right', F:'Forward', S:'Switch'};
const D4 = ['L','R','SL','SR'];
const SIDE = {L:'Left', R:'Right'};
const OFFAX = ['Cork','Bio/Misty','Flat Spin','Rodeo'];
const NOROT = ['Zero Spin','Frontflip','Backflip','Sideflip'];
const FLIPN = {1:'Single', 2:'Double', 3:'Triple', 4:'Quad'};
const GRABS = ['Blunt','Bow and Arrow','Broken Arrow','Critical','Cuban','Double Grab (both hands)','Double Japan','Esco','Guitar','High Mute','In and out','Indi-Truck','Inside Tail','Japan','Mute','Nose','Octo','Rocket','Safety',"Screamin' Seamen",'Seatbelt','Seatbelt Japan','Stale','Stink Bug','Tail','Truckdriver','Venom'];
const BOTH_HANDS = ['Double Grab (both hands)','Double Japan','Truckdriver'];
const TAKEOFFS = ['Carved','Blender','Hand-Drag','Inside Edge','Nosebutter','Tailbutter',"N'Ollie"];
const CREATIVE = ['Nosebutter','Tailbutter',"N'Ollie"];
const OBST = {'Tube':1, 'Simple rail':2, 'Demanding rail':3};   // wie Skills-Check (keine Box)
const obstLevel = o => OBST[o] || (o==='Tube / Box' ? 1 : 0);   // Altwert
// Freeski-Rail-Typ → Skills-Check-Stufe: Box/Tube = Tube, Rail = einfaches Rail, alles andere = anspruchsvolles Rail
const railLevel = rt => ['Box','Tube'].includes(rt) ? 'Tube' : rt==='Rail' ? 'Simple rail' : 'Demanding rail';
const RAIL_ON = ['50-50','Skislide','Lipslide','270','Lip 270','450','Lip 450'];
const RAIL_SWAP = ['Frontswap','Backswap','K-Fed','Britney','Super-Fed','Front 360 Swap','Back 360 Swap','Switch-Up'];
const RAIL_OUT = ['to normal','to switch','270 out','450 out','630 out','810 out','Pretzel 270','Pretzel 450'];
const HP_BASICS = ['Drop in','Switch drop in','Riding on the edges','Straight air','Straight air over coping','Waltz','Banana','Slash'];
const HP_AXES = ['Upright','Cork','Flat Spin','Flair','Bio/Misty','Rodeo'];
const LEVELS = ['T1','T2','T3','T4'];
const DISCS = ['Jump','Rail','Halfpipe'];
const DISC_LABEL = {Jump:'Jumps', Rail:'Rails', Halfpipe:'Halfpipe'};

const isSw = t => t.dir==='SL' || t.dir==='SR' || t.dir==='S';
const isOff = t => OFFAX.includes(t.axis);
const isFlip = t => ['Frontflip','Backflip','Sideflip','Rodeo','Bio/Misty'].includes(t.axis) || (+t.flips||1) >= 2;
const railOnName = t => {
  const sw = t.approach === 'S';
  return ({'50-50': sw?'Switch 50-50':'50-50', 'Skislide': sw?'Switch Tails on':'Skislide', 'Lipslide': sw?'Switch Lip on':'Lipslide',
    '270': sw?'Switch Tail 270 on':'270 on', 'Lip 270': sw?'Switch Lip 270 on':'Lip 270 on',
    '450': sw?'Switch Tail 450 on':'450 on', 'Lip 450': sw?'Switch Lip 450 on':'Lip 450 on'})[t.on] || t.on;
};
const railSpinOut = t => /out$|^Pretzel/.test(t.out || '');

const extraLbl = t => (t.style ? ' ' + t.style : '') + (t.bringback ? ' · Bring Back ' + t.bringback : '');
function trickLabel(disc, t){
  if (disc === 'Jump'){
    if (NOROT.includes(t.axis)) return [t.dir==='S'?'Switch':'', t.axis, t.grab].filter(Boolean).join(' ') + extraLbl(t) + (t.takeoff?` · ${t.takeoff}`:'');
    const fl = isOff(t) && +t.flips >= 2 ? FLIPN[t.flips] : '';
    const ax = t.axis && t.axis !== 'Upright' ? (t.axis==='Flat Spin' ? 'Flat' : t.axis) : '';
    return [DIRN[t.dir], fl, ax, t.rot, t.grab].filter(Boolean).join(' ') + extraLbl(t) + (t.takeoff?` · ${t.takeoff}`:'');
  }
  if (disc === 'Rail'){
    let s = `${SIDE[t.side]||''} ${railOnName(t)}`;
    if (t.swap) s += ` → ${t.swap}`;
    if (t.transfer) s += ` → ${t.transfer}`;
    s += ` → ${t.out}`;
    if (railSpinOut(t)) s += ` (${t.outSide}, ${String(t.foot||'').toLowerCase()} foot fwd${t.outStyle==='flip'?', flip/cork':''})`;
    return s.trim() + ` · ${t.railType || t.obstacle}`;
  }
  if (t.kind === 'basic') return `${t.basic}${/drop in/i.test(t.basic) ? ' '+(SIDE[t.side]||'') : ''}`.trim();
  const fl = ['Cork','Bio/Misty','Rodeo','Flat Spin'].includes(t.axis) && +t.flips >= 2 ? FLIPN[t.flips] : '';
  const ax = t.axis && t.axis !== 'Upright' ? (t.axis==='Flat Spin'?'Flat':t.axis) : '';
  return [t.sw?'Switch':'', t.ao?'Alley-oop':'', SIDE[t.dir], fl, ax, +t.rot ? t.rot : '', t.grab].filter(Boolean).join(' ') + extraLbl(t) + (+t.height ? ` · ${t.height} m` : '');
}

/* ══════════════════════════════════════════════════════════════════════
   SKILLS-CHECK-KATALOG (Quelle: SkillsCheck_Freeski_{Jumps,Rails,Halfpipe}.svg)
   Jede Vorgabe = ein «Slot» mit Prüffunktion auf das Trick-Objekt.
   Rotationen matchen exakt; nur «mindestens»-Vorgaben zählen aufwärts.
   grp: Slots, die je eine ANDERE Drehrichtung (key 'dir') bzw. einen
   anderen Eintrag (key 'id') brauchen — beste Zuordnung wird gesucht.
   ══════════════════════════════════════════════════════════════════════ */
const slot = (id, text, match, o={}) => ({id, text, match, ...o});

function jumpCatalog(g){
  const P = `J${g}`;
  const rotDir = (lv, deg, dirs) => dirs.map(d => slot(`${P}${lv}-${deg}-${d}`, `${DIRN[d]} ${deg}`, t => t.dir===d && +t.rot===deg));
  const grabs = lv => [...['Japan','Mute','Tail','Safety','Nose'].map(x => slot(`${P}${lv}-g-${x}`, `Grab: ${x}`, t => t.grab===x)),
    slot(`${P}${lv}-g-both`, 'Grab with both hands', t => BOTH_HANDS.includes(t.grab))];
  const ranked = (lv, specs, grp='rk') => specs.map((s,i) => slot(`${P}${lv}-${grp}${i}`, s[0], s[1], {grp:`${P}${lv}${grp}`, key:'dir'}));
  const flip = lv => slot(`${P}${lv}-flip`, 'At least one flip', isFlip);
  const swCork540 = lv => slot(`${P}${lv}-swc540`, 'Switch Cork 540', t => isSw(t) && t.axis==='Cork' && +t.rot===540);
  const cork360 = lv => slot(`${P}${lv}-c360`, 'Cork 360', t => t.axis==='Cork' && +t.rot===360);
  const swZero = lv => slot(`${P}${lv}-swzero`, 'Switch Zero Spin', t => t.axis==='Zero Spin' && isSw(t));
  const ax = (lv, dirs, axis, deg, pre='') => dirs.map(d => slot(`${P}${lv}-${axis}${deg}-${d}`, `${DIRN[d]} ${axis==='Bio/Misty'?'Misty/Bio':axis} ${deg}`, t => t.dir===d && t.axis===axis && +t.rot===deg));
  const grabRule = {id:'grabvar', text:'Every trick varied with a different grab'};
  const RANK_NOTE = 'Die vier Drehrichtungen werden pro Athlet:in von der stärksten bis zur schwächsten geordnet — die App sucht automatisch die beste Zuordnung.';

  if (g === 'M') return {
    T1:{meta:['Kicker S–M'], sections:[
      {title:'Rotation', slots:[...rotDir(1,180,D4), ...rotDir(1,360,D4)]},
      {title:'Axis & flips', slots:[flip(1)]},
      {title:'Grabs', slots:grabs(1)}]},
    T2:{meta:['Kicker M–L'], sections:[
      {title:'Rotation — ranked directions', note:'720 in the three strongest directions (at least two off-axis), 540 in the weakest. '+RANK_NOTE, slots:ranked(2,[
        ['720 off-axis · strongest direction', t => +t.rot===720 && isOff(t)],
        ['720 off-axis · 2nd direction', t => +t.rot===720 && isOff(t)],
        ['720 · 3rd direction', t => +t.rot===720],
        ['540 · weakest direction', t => +t.rot===540]])},
      {title:'Axis & flips', slots:[swCork540(2), cork360(2), swZero(2)]}]},
    T3:{meta:['Kicker L–XL','Foundation for doubles: broad range of directions and axes'], sections:[
      {title:'Rotation — all directions up to 900', slots:[...rotDir(3,540,D4), ...rotDir(3,720,D4)]},
      {title:'Axis & flips', slots:[...ax(3,['L','R'],'Cork',900), ...ax(3,['L','R'],'Bio/Misty',720), ...ax(3,['SL','SR'],'Cork',900), ...ax(3,['SL','SR'],'Bio/Misty',900)]},
      {title:'Take-off', note:'Tricks können X oder gecarved werden — anzustreben ist beides.', slots:[slot(`${P}3-carve`, 'Carved take-off', t => t.takeoff==='Carved')]}],
      rules:[grabRule]},
    T4:{meta:['Kicker XL','Develop according to individual strengths'], sections:[
      {title:'Rotation — ranked directions', note:'1620/1800/1980 in the two strongest directions, at least 1440 in the third, at least 1080 in the weakest. '+RANK_NOTE, slots:ranked(4,[
        ['≥ 1620 · strongest direction', t => +t.rot>=1620],
        ['≥ 1620 · 2nd direction', t => +t.rot>=1620],
        ['≥ 1440 · 3rd direction', t => +t.rot>=1440],
        ['≥ 1080 · weakest direction', t => +t.rot>=1080]])},
      {title:'Take-off', slots:[slot(`${P}4-creative`, "Creative take-off (nose-/tailbutter, N'Ollie)", t => CREATIVE.includes(t.takeoff)), slot(`${P}4-carve`, 'Carved take-off', t => t.takeoff==='Carved')]}],
      rules:[grabRule]},
  };
  return {
    T1:{meta:['Kicker S–M'], sections:[
      {title:'Rotation', slots:[...rotDir(1,180,D4), ...rotDir(1,360,['L','R'])]},
      {title:'Grabs', slots:grabs(1)}]},
    T2:{meta:['Kicker M'], sections:[
      {title:'Rotation — ranked directions', note:'At least 720 in the strongest, 540 in the 2nd and 3rd, 360 in the weakest direction. '+RANK_NOTE, slots:ranked(2,[
        ['≥ 720 · strongest direction', t => +t.rot>=720],
        ['≥ 540 · 2nd direction', t => +t.rot>=540],
        ['≥ 540 · 3rd direction', t => +t.rot>=540],
        ['≥ 360 · weakest direction', t => +t.rot>=360]])},
      {title:'Axis & flips', slots:[flip(2), swCork540(2), swZero(2)]}]},
    T3:{meta:['Kicker L','Foundation for doubles: broad range of directions and axes'], sections:[
      {title:'Rotation', slots:[
        slot(`${P}3-720-L`, 'Left 720 off-axis', t => t.dir==='L' && +t.rot===720 && isOff(t)),
        slot(`${P}3-720-R`, 'Right 720 off-axis', t => t.dir==='R' && +t.rot===720 && isOff(t)),
        ...ranked(3,[
          ['Switch 720 off-axis · stronger switch direction', t => isSw(t) && +t.rot===720 && isOff(t)],
          ['Switch 540 · weaker switch direction (upright ok)', t => isSw(t) && +t.rot===540]], 'sw')]},
      {title:'Axis & flips', slots:[
        slot(`${P}3-cond540`, 'Misty/Bio or Flat 540 — required if the forward 720s are Cork', t => ['Bio/Misty','Flat Spin'].includes(t.axis) && +t.rot===540,
          {cond: res => [res[`${P}3-720-L`], res[`${P}3-720-R`]].some(e => e && e.trick.axis==='Cork')}),
        cork360(3)]}],
      rules:[grabRule]},
    T4:{meta:['Kicker L–XL','Develop according to individual strengths'], sections:[
      {title:'Rotation — ranked directions', note:'At least a Double 1080 in the strongest, 900 in the 2nd and 3rd, 720 in the weakest direction. '+RANK_NOTE, slots:ranked(4,[
        ['Double ≥ 1080 · strongest direction', t => +t.flips>=2 && +t.rot>=1080],
        ['≥ 900 · 2nd direction', t => +t.rot>=900],
        ['≥ 900 · 3rd direction', t => +t.rot>=900],
        ['≥ 720 · weakest direction', t => +t.rot>=720]])}],
      rules:[grabRule]},
  };
}

function railCatalog(g){
  const P = `R${g}`;
  const LR = ['L','R'];
  const ob = n => t => obstLevel(t.obstacle) >= n;
  const mk = (id, text, min, m, o) => slot(id, text, t => ob(min)(t) && m(t), o);
  const slides = (p, min, ap) => {
    const r = [];
    const defs = ap==='F' ? [['Skislide','Skislide'],['Lipslide','Lipslide']] : [['Skislide','Switch Tails on'],['Lipslide','Switch Lip on']];
    for (const [on, nm] of defs) for (const s of LR) for (const o of ['to normal','to switch'])
      r.push(mk(`${p}-sl${ap}-${on}-${s}-${o}`, `${SIDE[s]} ${nm} ${o}`, min, t => t.side===s && t.approach===ap && t.on===on && t.out===o));
    return r;
  };
  const spinOut = (p, min, deg) => {
    const r = [];
    for (const sd of ['FS','BS']) for (const f of ['Right','Left'])
      r.push(mk(`${p}-o${deg}-${sd}-${f}`, `${sd} ${deg} out (${f.toLowerCase()} foot forward)`, min, t => t.out===`${deg} out` && t.outSide===sd && t.foot===f));
    return r;
  };
  const ON270 = [['270','F','270 on'],['Lip 270','F','Lip 270 on'],['270','S','Switch Tail 270 on'],['Lip 270','S','Switch Lip 270 on']];
  const ons = (p, min) => ON270.flatMap(([on,ap,nm]) => LR.map(s => mk(`${p}-on-${on}${ap}-${s}`, `${SIDE[s]} ${nm}`, min, t => t.side===s && t.approach===ap && t.on===on)));
  const onOut = (p, min, pretzel) => ON270.flatMap(([on,ap,nm]) => LR.map(s => mk(`${p}-${pretzel?'pz':'oo'}-${on}${ap}-${s}`,
    pretzel ? `${SIDE[s]} ${nm.replace(' on','')} pretzel 270` : `${SIDE[s]} ${nm} 270 out`, min,
    t => t.side===s && t.approach===ap && t.on===on && t.out===(pretzel?'Pretzel 270':'270 out'))));
  const swaps = (p, min) => {
    const r = [];
    for (const sw of ['Backswap','Frontswap']) for (const s of LR) for (const o of ['to normal','to switch'])
      r.push(mk(`${p}-sw-${sw}-${s}-${o}`, `${SIDE[s]} ${sw} ${o}`, min, t => t.side===s && t.swap===sw && t.out===o));
    for (const sw of ['K-Fed','Britney']) for (const s of LR) r.push(mk(`${p}-sw-${sw}-${s}`, `${sw} ${SIDE[s]}`, min, t => t.side===s && t.swap===sw));
    return r;
  };
  const distinct = (p, n, text, min, m, ext=[]) => [...ext.map((x,i) => mk(`${p}-${i}x`, x[0], min, x[1], {grp:p, key:'id'})),
    ...Array.from({length:n}, (_,i) => mk(`${p}-${i}`, text, min, m, {grp:p, key:'id'}))];
  const on270any = t => ['270','Lip 270'].includes(t.on);

  const T1 = {meta:['Obstacle: Tube'], sections:[
    {title:'Slides', slots:slides(`${P}1`,1,'F')},
    {title:'Switch on', slots:slides(`${P}1`,1,'S')},
    {title:'Out', slots:spinOut(`${P}1`,1,270)}]};
  const RN = 'Wiederholung = Tricks aus früheren Phasen auf dem schwierigeren Obstacle.';
  if (g === 'M') return {
    T1,
    T2:{meta:['Obstacle: Tube or rail'], sections:[
      {title:'On', slots:ons(`${P}2`,1)},
      {title:'Swaps', note:'Back- & Frontswap to switch and to normal (bzw. Switch-Up).', slots:swaps(`${P}2`,1)},
      {title:'Out', slots:spinOut(`${P}2`,1,450)}]},
    T3:{meta:['Obstacle: Simple rail'], sections:[
      {title:'On – Out', slots:onOut(`${P}3`,2,false)},
      {title:'Pretzel', slots:onOut(`${P}3`,2,true)},
      {title:'More', slots:[...LR.map(s => mk(`${P}3-sf-${s}`, `Super-Fed ${SIDE[s]}`, 2, t => t.side===s && t.swap==='Super-Fed')),
        mk(`${P}3-flipout`, 'At least one flip/cork out', 2, t => railSpinOut(t) && t.outStyle==='flip')]}]},
    T4:{meta:['Obstacle: Demanding rail', RN], sections:[
      {title:'New', slots:[
        ...distinct(`${P}4-in450`, 3, '450 in', 3, t => ['450','Lip 450'].includes(t.on)),
        ...distinct(`${P}4-sw360`, 2, '360 swap', 3, t => ['Front 360 Swap','Back 360 Swap'].includes(t.swap)),
        mk(`${P}4-o630`, 'Spin/flip out 630', 3, t => t.out==='630 out'),
        mk(`${P}4-o810`, 'Spin out 810', 3, t => t.out==='810 out')]},
      {title:'Wiederholung — On – Out', slots:onOut(`${P}4`,3,false)},
      {title:'Wiederholung — Pretzel', slots:onOut(`${P}4`,3,true)}]},
  };
  return {
    T1,
    T2:{meta:['Obstacle: Tube or rail'], sections:[
      {title:'Swaps', note:'Back- & Frontswap to switch and to normal (bzw. Switch-Up).', slots:swaps(`${P}2`,1)}]},
    T3:{meta:['Obstacle: Simple rail / tube or rail', RN], sections:[
      {title:'New — simple rail', slots:distinct(`${P}3-o450`, 2, '450 out', 2, t => t.out==='450 out')},
      {title:'New — tube or rail', note:'At least two 270 on, at least one of them switch.', slots:distinct(`${P}3-on270`, 1, '270 on', 1, on270any, [['Switch 270 on', t => on270any(t) && t.approach==='S']])},
      {title:'Wiederholung — slides (simple rail)', slots:[...slides(`${P}3`,2,'F'), ...slides(`${P}3`,2,'S')]},
      {title:'Wiederholung — swaps (simple rail)', slots:swaps(`${P}3`,2)}]},
    T4:{meta:['Obstacle: Demanding rail / simple rail', RN], sections:[
      {title:'New — simple rail', note:'At least one of each pair switch.', slots:[
        ...distinct(`${P}4-oo`, 1, '270 on 270 out', 2, t => on270any(t) && t.out==='270 out', [['Switch 270 on 270 out', t => on270any(t) && t.approach==='S' && t.out==='270 out']]),
        ...distinct(`${P}4-pz`, 1, '270 pretzel 270', 2, t => on270any(t) && t.out==='Pretzel 270', [['Switch 270 pretzel 270', t => on270any(t) && t.approach==='S' && t.out==='Pretzel 270']])]},
      {title:'Wiederholung — slides (demanding rail)', slots:[...slides(`${P}4`,3,'F'), ...slides(`${P}4`,3,'S')]},
      {title:'Wiederholung — out & swaps (demanding rail)', slots:[...spinOut(`${P}4`,3,270), ...swaps(`${P}4`,3), ...distinct(`${P}4-o450`, 2, '450 out', 3, t => t.out==='450 out')]}]},
  };
}

function hpCatalog(g){
  const P = `H${g}`;
  const LR = ['L','R'];
  const b = (id, text, m) => slot(`${P}${id}`, text, t => t.kind==='basic' && m(t));
  const air = (id, text, o) => slot(`${P}${id}`, text, t => t.kind==='air'
    && (o.rot == null || +t.rot===o.rot)
    && !!t.sw === !!o.sw && !!t.ao === !!o.ao
    && (!o.axis || t.axis===o.axis) && (!o.flips || +t.flips>=o.flips) && (!o.dir || t.dir===o.dir));
  const both = (id, text, o) => LR.map(d => air(`${id}-${d}`, `${text} ${SIDE[d]}`, {...o, dir:d}));
  const height = (lv, m) => slot(`${P}${lv}-h`, `Air height ≥ ${m} m (focus)`, t => t.kind==='air' && +t.height >= m);
  const hM = {T1:2.5, T2:3.5, T3:4, T4:5}, hW = {T1:1.5, T2:2, T3:3, T4:3.5};
  const H = g==='M' ? hM : hW;
  const T1 = {meta:[`Focus: air height ${H.T1} m`], sections:[
    {title:'Basics', slots:[
      ...LR.map(s => b(`1-drop-${s}`, `Drop in ${SIDE[s]} (in the wall, not transition)`, t => t.basic==='Drop in' && t.side===s)),
      b('1-edges', 'Riding on the good edges', t => t.basic==='Riding on the edges'),
      b('1-straight', 'Straight air (flat skis, no edges)', t => t.basic==='Straight air'),
      b('1-waltz', 'Waltz — every direction (360 on snow)', t => t.basic==='Waltz'),
      b('1-banana', 'Banana straight to switch — every direction', t => t.basic==='Banana'),
      b('1-slash', 'Slash at the coping', t => t.basic==='Slash')]},
    {title:'Focus', slots:[height(1, H.T1)]}]};
  const T2 = {meta:[`Focus: air height ${H.T2} m`], sections:[
    {title:'Basics', slots:[b('2-coping', 'Straight air over coping', t => t.basic==='Straight air over coping')]},
    {title:'Forward', slots:[...both('2-360', '360 down the pipe', {rot:360}), air('2-540', '540 down the pipe (L or R)', {rot:540})]},
    {title:'Switch', slots:both('2-sw360', 'Switch 360 down the pipe', {rot:360, sw:true})},
    {title:'Alley-oop', slots:[...both('2-ao180', 'Alley-oop 180', {rot:180, ao:true}), ...both('2-ao360', 'Alley-oop 360', {rot:360, ao:true}), ...both('2-swao360', 'Switch Alley-oop 360', {rot:360, ao:true, sw:true})]},
    {title:'Focus', slots:[height(2, H.T2)]}]};
  if (g === 'M') return {
    T1, T2,
    T3:{meta:[`Focus: air height ${H.T3} m`], sections:[
      {title:'Forward', slots:[...both('3-540', '540 down the pipe', {rot:540}), air('3-720', '720 down the pipe (L or R)', {rot:720})]},
      {title:'Switch', slots:[...both('3-sw540', 'Switch 540 down the pipe', {rot:540, sw:true}), ...LR.map(s => b(`3-swdrop-${s}`, `Switch drop in ${SIDE[s]}`, t => t.basic==='Switch drop in' && t.side===s))]},
      {title:'Alley-oop', slots:both('3-ao540', 'Alley-oop 540', {rot:540, ao:true})},
      {title:'Off-axis', slots:[...both('3-flair', 'Flair', {axis:'Flair'}), air('3-c900', 'Cork 900 (L or R)', {rot:900, axis:'Cork'}),
        air('3-swc720', 'Switch Cork 720 (L or R)', {rot:720, axis:'Cork', sw:true}), air('3-aof540', 'Alley-oop Flat 540 (L or R)', {rot:540, axis:'Flat Spin', ao:true})]},
      {title:'Focus', slots:[height(3, H.T3)]}]},
    T4:{meta:[`Focus: air height ${H.T4} m`], sections:[
      {title:'Off-axis', slots:[...both('4-c900', 'Cork 900', {rot:900, axis:'Cork'}), air('4-c1080', 'Cork 1080 (L or R)', {rot:1080, axis:'Cork'}),
        slot(`${P}4-d1260`, 'Double 1260 (L or R)', t => t.kind==='air' && !t.ao && !t.sw && +t.flips>=2 && +t.rot===1260),
        slot(`${P}4-d1620`, 'Double 1620 (L or R)', t => t.kind==='air' && !t.ao && !t.sw && +t.flips>=2 && +t.rot===1620),
        slot(`${P}4-swd1080`, 'Switch Double 1080 (L or R)', t => t.kind==='air' && t.sw && +t.flips>=2 && +t.rot===1080),
        air('4-aof720', 'Alley-oop Flat 720', {rot:720, axis:'Flat Spin', ao:true})]},
      {title:'Focus', slots:[height(4, H.T4)]}]},
  };
  return {
    T1, T2,
    T3:{meta:[`Focus: air height ${H.T3} m`], sections:[
      {title:'Forward', slots:[...both('3-540', '540 down the pipe', {rot:540}), air('3-720', '720 down the pipe (L or R)', {rot:720})]},
      {title:'Switch', slots:[...both('3-sw540', 'Switch 540 down the pipe', {rot:540, sw:true}), air('3-sw720', 'Switch 720 (L or R)', {rot:720, sw:true})]},
      {title:'Alley-oop', slots:both('3-ao540', 'Alley-oop 540', {rot:540, ao:true})},
      {title:'Focus', slots:[height(3, H.T3)]}]},
    T4:{meta:[`Focus: air height ${H.T4} m`], sections:[
      {title:'Off-axis', slots:[air('4-flair', 'Flair (L or R)', {axis:'Flair'}), air('4-c900', 'Cork 900 (L or R)', {rot:900, axis:'Cork'}),
        air('4-swc720', 'Switch Cork 720 (L or R)', {rot:720, axis:'Cork', sw:true}), air('4-aof540', 'Alley-oop Flat 540 (L or R)', {rot:540, axis:'Flat Spin', ao:true})]},
      {title:'Focus', slots:[height(4, H.T4)]}]},
  };
}

    {k:'landing', name:'Landing', hints:['Lands in the sweet spot — not on the knuckle, not flat','Centred on both skis, not in the backseat','No hand drag, butt check or washout — rides away clean']},
  ],
  // Halfpipe = gleiche Kriterien wie Jumps + Amplitude (FIS JH 8.3.1) → max. 5 Punkte
  hp: [
    {k:'takeoff', name:'Take-Off', hints:['Takes off high on the wall at the coping','Timing & pop, no early rotation','Line keeps speed for the next hit']},
    {k:'trick', name:'Trick (Axis / Control)', hints:['Clean, recognisable axis — as declared','Rotation completed before landing','Controlled body position throughout']},
    {k:'grab', name:'Grab', hints:['Grab on the ski — not boot, binding or knee','Held through most of the trick','Tweak / bone is a plus']},
    {k:'landing', name:'Landing', hints:['Lands high in the wall, not on the deck or flat bottom','Centred, no backseat','No hand drag, butt check or washout']},
    {k:'amplitude', name:'Amplitude', hints:['Height above the coping fits the level (Skills-Check focus)','Keeps amplitude from hit to hit — no loss of height','Distance down the pipe in proportion to the height']},
  ],
  rail: [
    {k:'takeon', name:'Take-On', hints:['Clean pop onto the feature','Spin-in fully rotated, no sketch or ski-cross on the way on']},
    {k:'control', name:'Trick (Control on rail)', hints:['Stable, centred position on the feature','Slides the full length, no correcting','Swap / press clearly shown']},
    {k:'out', name:'Out', hints:['Clean pop off the end','Spin-out / pretzel fully rotated as declared']},
    {k:'landing', name:'Landing', hints:['Centred landing, rides away clean','No hand drag, butt check or washout']},
  ],
};
const critSetFor = disc => disc==='Rail' ? CRIT.rail : disc==='Halfpipe' ? CRIT.hp : CRIT.jump;
const critSet = e => critSetFor(e.discipline);
const maxFor = disc => critSetFor(disc).length;

/* ══════════════════════════════════════════════════════════════════════
   ABGLEICH-ENGINE
   ══════════════════════════════════════════════════════════════════════ */
const safeMatch = (s, t) => { try { return !!s.match(t); } catch { return false; } };
const entryVal = e => !e ? 0 : e.status==='reviewed' ? 100 + Math.round((e.score||0) / maxFor(e.discipline) * 40) : (e.status==='pending'||e.status==='rework') ? 5 : 1;
const bestOf = list => list.reduce((b, e) => (!b || entryVal(e) > entryVal(b) || (entryVal(e)===entryVal(b) && e.created_at > b.created_at)) ? e : b, null);

function assignGroup(slots, cand, res){
  const keyOf = e => slots[0].key==='id' ? e.id : e.trick.dir;
  const lists = slots.map(s => {
    const m = new Map();
    for (const e of cand) if (safeMatch(s, e.trick)) { const k = keyOf(e); if (!m.has(k) || entryVal(e) > entryVal(m.get(k))) m.set(k, e); }
    return [...m.values()].sort((a,b) => entryVal(b) - entryVal(a)).slice(0, 6);
  });
  let bestSum = -1, bestPick = [];
  const pick = [], used = new Set();
  (function rec(i, sum){
    if (i === slots.length){ if (sum > bestSum){ bestSum = sum; bestPick = [...pick]; } return; }
    for (const e of lists[i]){
      const k = keyOf(e); if (used.has(k)) continue;
      used.add(k); pick[i] = e; rec(i+1, sum + entryVal(e)); used.delete(k);
    }
    pick[i] = null; rec(i+1, sum);
  })(0, 0);
  slots.forEach((s, i) => res[s.id] = bestPick[i] || null);
}

function slotState(e){
  if (!e) return 'open';
  if (e.status==='reviewed') return e.score===maxFor(e.discipline) ? 'done' : 'partial';
  if (e.status==='pending' || e.status==='rework') return 'pending';
  return 'goal';
}

// Wertet eine Stufe (Disziplin × Geschlecht × Level) für die Einträge einer Athlet:in aus.
function evaluate(disc, gender, level, entries){
  const def = CATALOG[disc]?.[gender]?.[level];
  if (!def) return null;
  const cand = entries.filter(e => e.discipline===disc);
  const slots = def.sections.flatMap(s => s.slots);
  const res = {}, groups = {};
  for (const s of slots){
    if (s.grp) (groups[s.grp] ||= []).push(s);
    else res[s.id] = bestOf(cand.filter(e => safeMatch(s, e.trick)));
  }
  for (const ss of Object.values(groups)) assignGroup(ss, cand, res);
  let pts = 0, max = 0, done = 0, n = 0, pending = 0;
  const out = {};
  for (const s of slots){
    const applicable = s.cond ? s.cond(res) : true;
    const e = res[s.id];
    const st = applicable ? slotState(e) : 'na';
    const p = applicable && e && e.status==='reviewed' ? (e.score||0) : 0;
    out[s.id] = {entry:e, state:st, pts:p, applicable};
    if (!applicable) continue;
    n++; max += maxFor(disc); pts += p;
    if (st==='done') done++;
    if (st==='pending') pending++;
  }
  // Regel: jeder Trick mit einem anderen Grab
  const rules = (def.rules||[]).map(r => {
    const used = [...new Set(Object.values(out).map(o => o.entry).filter(Boolean))];
    const grabs = used.map(e => e.trick.grab).filter(Boolean);
    const distinct = new Set(grabs).size;
    return {...r, ok: used.length > 0 && distinct === used.length, detail: used.length ? `${distinct} different grab${distinct===1?'':'s'} in ${used.length} matched trick${used.length===1?'':'s'}` : 'no tricks matched yet'};
  });
  return {def, out, pts, max, done, n, pending, rules};
}

// Direkte Treffer (ohne Zuordnung) — für Vorschau und Chips.
function directMatches(disc, gender, trick){
  const r = [];
  for (const lv of LEVELS){
    const def = CATALOG[disc]?.[gender]?.[lv]; if (!def) continue;
    const seen = new Set();
    for (const sec of def.sections) for (const s of sec.slots){
      if (s.grp && seen.has(s.grp)) continue;
      if (safeMatch(s, trick)){ r.push({level:lv, text:s.text, id:s.id}); if (s.grp) seen.add(s.grp); }
    }
  }
  return r;
}

// Welche Vorgaben der eigenen Stufe dieser Eintrag nach der Zuordnung tatsächlich abdeckt.
const _evalCache = new Map();
function assignedSlots(e){
  const ath = prof(e.athlete_id); if (!ath?.gender || !ath?.level) return [];
  const key = `${ath.id}|${ath.level}|${e.discipline}|${ST.entries.length}|${ST._rev||0}`;
  let ev = _evalCache.get(key);
  if (!ev){ ev = evaluate(e.discipline, ath.gender, ath.level, entriesOf(ath.id)); _evalCache.set(key, ev); }
  if (!ev) return [];
  const r = [];
  for (const sec of ev.def.sections) for (const s of sec.slots) if (ev.out[s.id]?.entry?.id === e.id && ev.out[s.id].applicable) r.push({level:ath.level, text:s.text, id:s.id});
  return r;
}

// Demo-Sessions mit Versuchen (deterministischer Zufall, Qualität steigt über die Sessions)
function demoSessions(){
  let r = 7; const rnd = () => { r = (r * 16807) % 2147483647; return (r - 1) / 2147483646; };
  const J = (dir, axis, rot, grab) => ['Jump', {dir, axis, rot, grab, flips:OFFAX.includes(axis)?1:null, takeoff:''}];
  const TR = {
    'u-lena': [J('L','Cork',720,'Safety'), J('SL','Upright',540,'Japan'), J('S','Zero Spin',null,'Safety')],
    'u-noah': [J('L','Upright',360,'Japan'), J('R','Upright',180,'Mute'), J('F','Backflip',null,'')],
    'u-luca': [J('L','Cork',720,'Safety'), J('R','Cork',720,'Mute'), J('SL','Upright',540,'Tail')],
    'u-mia':  [J('L','Cork',720,'Safety'), J('R','Cork',720,'Mute')],
    'u-elia': [['Halfpipe', {kind:'air', dir:'L', sw:false, ao:false, axis:'Upright', flips:null, rot:540, grab:'Safety', height:3.5}], ['Halfpipe', {kind:'air', dir:'R', sw:false, ao:true, axis:'Upright', flips:null, rot:360, grab:'Mute', height:3}]],
  };
  const plan = [
    ['g-a', ['u-lena','u-noah','u-luca'], [[24,'Landing Bag','Laax'], [17,'Big Air Training','Laax'], [10,'Big Air Training','Laax'], [3,'Big Air Training','Laax']], 'u-coach-a'],
    ['g-b', ['u-mia','u-elia'], [[12,'Big Air Training','Saas-Fee'], [5,'Halfpipe Training','Saas-Fee']], 'u-coach-b'],
  ];
  const sessions = [], attempts = [];
  for (const [gid, aths, days, coach] of plan) days.forEach(([ago, type, loc], si) => {
    const start = new Date(Date.now() - ago*86400000); start.setHours(9, 30, 0, 0);
    const s = {id:uid(), created_by:coach, group_id:gid, date:start.toISOString().slice(0,10), type, location:loc, duration_min:180, conditions:3 + (si % 3), comments:si===days.length-1 ? 'Gute Bedingungen, Kicker frisch geshapt.' : null,
      athlete_ids:aths, athlete_notes:{}, started_at:start.toISOString(), ended_at:new Date(start.getTime() + 3*3600000).toISOString()};
    sessions.push(s);
    let t = start.getTime();
    for (const aid of aths) for (const [disc, trick] of TR[aid]){
      if (typeDisc(type) !== disc && type !== 'Landing Bag') continue;
      const n = 3 + Math.floor(rnd()*4), p = 0.42 + 0.13*si;
      const set = critSetFor(disc);
      for (let k = 0; k < n; k++){
        t += 60000 * (2 + Math.floor(rnd()*5));
        const fell = rnd() < 0.2 - 0.04*si;
        const crit = Object.fromEntries(set.map(c => [c.k, !fell && rnd() < p + 0.08*k/n]));
        const note = fell ? 'Tags: ' + FAIL_REASONS[Math.floor(rnd() * FAIL_REASONS.length)] : null;
        attempts.push({id:uid(), session_id:s.id, athlete_id:aid, discipline:disc, trick, label:trickLabel(disc, trick), crit, score:Object.values(crit).filter(Boolean).length, max:set.length, fell, note, entry_id:null, created_by:coach, created_at:new Date(t).toISOString()});
      }
    }
  });
  return {sessions, attempts};
}

  async _upsert(table, list, row){
    const exists = list.some(x => x.id===row.id);
    const { created_at, created_by, ...rest } = row;
    const run = r => (exists ? db.from(table).update(r).eq('id', row.id) : db.from(table).insert(r)).select().single();
    let { data, error } = await run(rest);
    if (error && /column|schema cache/i.test(error.message || '')){
      const OPT = ['jump_size','results','outcome','run_no'];   // aus Update 3
      const slim = Object.fromEntries(Object.entries(rest).filter(([k]) => !OPT.includes(k)));
      ({ data, error } = await run(slim));
      if (!error){ console.warn('Update 3 (nachwuchs_migration_3.sql) fehlt — neue Felder nicht gespeichert'); data = {...rest, ...data}; }
    }
    if (error) throw error; return data;
  },

    let { data, error } = await run(row);

      await new Promise((resolve, reject) => {
        const up = new tus.Upload(file, {
          endpoint: `${SUPABASE_URL}/storage/v1/upload/resumable`,
          retryDelays: [0, 2000, 5000, 10000, 20000],
          headers: { authorization: `Bearer ${session.access_token}`, 'x-upsert': 'false' },
          uploadDataDuringCreation: true, removeFingerprintOnSuccess: true, chunkSize: 6*1024*1024,
          metadata: { bucketName: VIDEO_BUCKET, objectName: path, contentType: file.type || 'video/mp4', cacheControl: '3600' },
          onError: reject,
          onProgress: (a, b) => onProgress?.(Math.round(a / b * 100)),
          onSuccess: resolve,
        });
        up.findPreviousUploads().then(prev => { if (prev.length) up.resumeFromPreviousUpload(prev[0]); up.start(); });
      });
    } else {
      const { error } = await db.storage.from(VIDEO_BUCKET).upload(path, file, {contentType:file.type || 'video/mp4'});
      if (error) throw error; onProgress?.(100);
    }
    return path;
  },

const ST = {me:null, profiles:[], groups:[], entries:[], notes:[], sessions:[], attempts:[], rep:{sel:null, type:'', athlete:'', period:'season', raw:''}, mon:{view:'team', athleteId:null, key:null, period:'season', typ:'', from:'', to:''}, page:'assessment', athleteId:null, level:null, disc:'Jump', groupFilter:'', entryFilter:'all', form:null, pendingFile:null};

function visibleAthleteIds(me, profiles){
  const ath = profiles.filter(p => p.role==='athlete');
  if (me.role==='dvlp') return new Set(ath.map(p => p.id));
  if (me.role==='coach') return new Set(ath.filter(p => p.group_id && p.group_id===me.group_id).map(p => p.id));
  return new Set([me.id]);
}
const isStaff = () => ST.me && ST.me.role !== 'athlete';
const prof = id => ST.profiles.find(p => p.id===id);
const groupName = id => ST.groups.find(g => g.id===id)?.name || '—';
function visibleAthletes(){
  const ids = visibleAthleteIds(ST.me, ST.profiles);
  return ST.profiles.filter(p => ids.has(p.id) && (!ST.groupFilter || (ST.groupFilter==='__none' ? !p.group_id : p.group_id===ST.groupFilter))).sort((a,b) => a.name.localeCompare(b.name));
}
const entriesOf = id => ST.entries.filter(e => e.athlete_id===id);
const ROLE_LABEL = {athlete:'Athlete', coach:'Coach', dvlp:'DVLP / Nachwuchs'};

/* ══════════════════════════════════════════════════════════════════════
   HILFSFUNKTIONEN UI
   ══════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const initials = n => String(n||'?').split(/\s+/).map(x => x[0]).slice(0,2).join('').toUpperCase();
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const fmtAgo = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : fmtDate(iso); };
const stars = (n, max=4) => `<span class="stars" title="${n}/${max}">${'★'.repeat(n)}<span class="off">${'★'.repeat(Math.max(0, max-n))}</span></span>`;
let toastT;
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err?' err':''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2800); }
function statusChip(e){
  if (e.status==='reviewed'){ const mx = maxFor(e.discipline); return `<span class="chip ${e.score===mx?'green':e.score/mx>=.5?'gold':'red'}">${stars(e.score||0, mx)} ${e.score}/${mx}</span>`; }
  if (e.status==='pending') return `<span class="chip blue">⏳ Waiting for coach</span>`;
  if (e.status==='rework') return `<span class="chip red">↺ New video requested</span>`;
  return `<span class="chip">🎯 Goal</span>`;
}
const ICON = {done:'✓', partial:'½', pending:'⏳', goal:'🎯', open:'', na:'–'};
function athleteSelect(onchangeFn){
  const aths = visibleAthletes();
  if (!aths.length) return '<span class="muted small">No athletes in this group yet.</span>';
  const byGroup = {};
  aths.forEach(a => (byGroup[a.group_id||''] ||= []).push(a));
  return `<select id="ath-sel" onchange="${onchangeFn}(this.value)" style="max-width:320px">${Object.entries(byGroup).map(([gid, list]) =>
    `<optgroup label="${esc(gid?groupName(gid):'No group')}">${list.map(a => `<option value="${a.id}" ${a.id===ST.athleteId?'selected':''}>${esc(a.name)} · ${a.level||'–'}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
function groupFilterSelect(){
  if (ST.me.role !== 'dvlp') return '';
  return `<select onchange="setGroupFilter(this.value)" style="max-width:240px"><option value="">All groups</option><option value="__none" ${ST.groupFilter==='__none'?'selected':''}>— No group yet —</option>${ST.groups.map(g => `<option value="${g.id}" ${ST.groupFilter===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`;
}
function setGroupFilter(v){ ST.groupFilter = v; const a = visibleAthletes(); if (!a.some(x => x.id===ST.athleteId)) ST.athleteId = a[0]?.id || null; render(); }
function pickAthlete(id){ ST.athleteId = id; ST.level = null; ST.form = null; render(); }

/* ══════════════════════════════════════════════════════════════════════
   GRUNDGERÜST: Header, Tabs, Benachrichtigungen

function pendingForMe(){ const ids = visibleAthleteIds(ST.me, ST.profiles); return ST.entries.filter(e => e.status==='pending' && ids.has(e.athlete_id)); }
const NAV_ICONS = (() => {
  const i = d => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  return {
    assessment: i('<path d="M9 5h11M9 12h11M9 19h11"/><path d="M4 5h.01M4 12h.01M4 19h.01"/>'),
    skills: i('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),
    session: i('<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>'),
    reports: i('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>'),
    monitoring: i('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
    reviews: i('<path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>'),
    team: i('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .6 3.3 2.6 3.5 5.5"/>'),
  };
})();
function renderChrome(){
  const unread = ST.notes.filter(n => !n.read_at).length;
  $('#who').innerHTML = `
    <button class="iconbtn" onclick="toggleNotifs(event)" title="Notifications">🔔${unread?`<span class="badge">${unread}</span>`:''}</button>
    <span class="chip">${esc(ST.me.name)} · ${ROLE_LABEL[ST.me.role]}</span>
    <button class="iconbtn" onclick="logout()">Log out</button>`;
  const tabs = [['assessment','Assessment'], ['skills','Skills-Check']];
  if (isStaff()) tabs.push(['session','Session'], ['reports','Reports'], ['monitoring','Monitoring'], ['reviews','Reviews'], ['team','Team']);
  const pend = isStaff() ? pendingForMe().length : 0;
  const bn = $('#bottom-nav'); bn.hidden = false;
  bn.innerHTML = tabs.map(([k, l]) => `<button class="${ST.page===k?'on':''}" onclick="go('${k}')">${NAV_ICONS[k]}<span>${({assessment:'Assess', skills:'Skills', monitoring:'Monitor'})[k] || l}</span>${k==='reviews'&&pend?`<i class="bn-badge">${pend}</i>`:''}</button>`).join('');
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab-btn ${ST.page===k?'on':''}" onclick="go('${k}')">${l}${k==='reviews'&&pend?`<span class="cnt">${pend}</span>`:''}</button>`).join('');
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id===`page-${ST.page}`));
}
function go(page){ ST.page = page; document.querySelectorAll('.page').forEach(p => { if (p.id !== 'page-' + page) p.innerHTML = ''; }); render(); window.scrollTo({top:0}); }
function toggleNotifs(ev){
  ev?.stopPropagation();
  const dd = $('#notif-dd');
  if (!dd.hidden){ dd.hidden = true; return; }
  dd.innerHTML = ST.notes.length ? ST.notes.slice().sort((a,b) => b.created_at.localeCompare(a.created_at)).map(n => `
    <div class="n ${n.read_at?'':'unread'}" onclick="openNotif(${JSON.stringify(n.id)})">
      <div>${n.kind==='submitted'?'📥 New trick to review':n.kind==='rework'?'↺ Coach asks for a new video':'⭐ Your trick was rated'}</div>
      <div style="font-weight:600;color:var(--char)">${esc(n.text)}</div><div class="d">${fmtAgo(n.created_at)}</div></div>`).join('')
    : '<div class="empty">No notifications</div>';
  dd.hidden = false;
  const ids = ST.notes.filter(n => !n.read_at).map(n => n.id);
  if (ids.length) Store.markRead(ids).then(() => { ST.notes.forEach(n => { if (ids.includes(n.id)) n.read_at = nowIso(); }); renderChrome(); }).catch(() => {});
}
document.addEventListener('click', e => { const dd = $('#notif-dd'); if (dd && !dd.hidden && !dd.contains(e.target)) dd.hidden = true; });
function openNotif(id){
  $('#notif-dd').hidden = true;
  const n = ST.notes.find(x => x.id===id); const e = n && ST.entries.find(x => x.id===n.entry_id);
  if (!e){ toast('This trick no longer exists.', true); return; }
  ST.athleteId = e.athlete_id;
  if (isStaff() && e.status==='pending'){ go('reviews'); openReview(e.id); }
  else { go('assessment'); setTimeout(() => document.getElementById('en-'+e.id)?.scrollIntoView({behavior:'smooth', block:'center'}), 50); }
}

function render(){
  renderChrome();
  if (ST.page==='assessment') renderAssessment();
  else if (ST.page==='skills') renderSkills();
  else if (ST.page==='reviews') renderReviews();
  else if (ST.page==='team') renderTeam();
  else if (ST.page==='session') renderSession();
  else if (ST.page==='reports') renderReports();
  else if (ST.page==='monitoring') renderMonitoring();
}

/* ══════════════════════════════════════════════════════════════════════
   ASSESSMENT — Tricks erfassen (+ Video), eigene Liste
   ══════════════════════════════════════════════════════════════════════ */
const FORM_DEFAULTS = {
  Jump: {axis:'Upright', dir:'L', flips:'1', rot:'360', grab:'', takeoff:'', bringback:'', style:''},
  Rail: {railType:'Tube', obstacle:'Tube', side:'L', approach:'F', on:'Skislide', swap:'', transfer:'', out:'to normal', outSide:'FS', foot:'Right', outStyle:''},
  Halfpipe: {kind:'air', basic:'Drop in', side:'L', dir:'L', sw:'', ao:'', axis:'Upright', flips:'1', rot:'360', grab:'', height:'', bringback:'', style:''},
};
const opts = (list, v) => list.map(o => {
  if (o && o.group) return `<optgroup label="${esc(o.group)}">${opts(o.items, v)}</optgroup>`;
  const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`; }).join('');
const rotList = (from, to) => { const r = []; for (let x = from; x <= to; x += 180) r.push([String(x), String(x)]); return r; };

function formFields(disc, F, fn='formSet'){
  // Aufbau wie Freeski-Assessment: zweispaltiges form-grid, Grab als Button-Auswahl
  const f = [];
  const add = (k, label, list, show=true) => { if (show) f.push(`<div class="form-group"><label>${label}</label><select onchange="${fn}('${k}', this.value)">${opts(list, F[k])}</select></div>`); };
  const grabBlock = () => f.push(`<div class="form-group full"><label>Grab <span class="lbl-hint">(click to select · click again = no grab)</span></label>
    <div class="grabchips">${GRABS.map((g, i) => `<button type="button" class="gchip ${F.grab===g?'on':''}" onclick="${fn}('grab', F_GRAB(${i}, ${esc(JSON.stringify(F.grab||''))}))">${esc(g)}</button>`).join('')}</div></div>`);
  if (disc==='Jump'){
    f.push('<div class="section-divider">Jump</div>');
    const noRot = NOROT.includes(F.axis);
    add('dir', 'Direction', noRot ? [['F','Forward'],['S','Switch']] : D4.map(d => [d, DIRN[d]]));
    add('flips', 'Flips', [['1','Single'],['2','Double'],['3','Triple'],['4','Quad']], OFFAX.includes(F.axis));
    add('axis', 'Axis', [{group:'Off-Axis', items:[['Cork','Cork'],['Bio/Misty','Bio/Misty'],['Flat Spin','Flat Spins'],['Rodeo','Rodeo']]},
      {group:'Upright Spins (Longitudinal Axis)', items:[['Upright','Upright Spins']]},
      {group:'Classic Acrobatic Axis (Transverse Axis and Sagittal Axis)', items:['Frontflip','Backflip','Sideflip']},
      {group:'Straight Air', items:[['Zero Spin','Zero Spin']]}]);
    add('rot', 'Rotation', rotList(180, 2520), !noRot);
    add('takeoff', 'Take-Off', [['','–'], ...TAKEOFFS]);
    grabBlock();
    add('bringback', 'Bring Back', [['','–'],'180','360','540']);
    add('style', 'Style Element', [['','–'],'Tweak/Bone','Poke']);
  } else if (disc==='Rail'){
    f.push('<div class="section-divider">Rail</div>');
    // Vokabular wie Freeski-Assessment; die Skills-Check-Stufe (Tube / einfaches / anspruchsvolles Rail) ergibt sich aus dem Rail Type
    const customRail = [...new Set(ST.entries.map(e => e.trick?.railType).filter(Boolean))].filter(t => !RAIL_TYPES.includes(t));
    const transfers = [...new Set(ST.entries.map(e => e.trick?.transfer).filter(Boolean))];
    f.push(`<div class="form-group"><label>Rail Type <span class="lbl-hint">(Skills-Check: ${esc(railLevel(F.railType))})</span></label><select onchange="${fn}('railType', this.value==='__add__' ? (prompt('New rail type:')||'${esc(F.railType)}') : this.value)">${opts([...RAIL_TYPES, ...customRail, ...(F.railType && !RAIL_TYPES.includes(F.railType) && !customRail.includes(F.railType) ? [F.railType] : []), ['__add__','＋ Add new…']], F.railType)}</select></div>`);
    add('side', 'Direction', [['L','Left'],['R','Right']]);
    add('approach', 'Stance', [['F','Forward'],['S','Switch']]);
    add('on', 'In-Spin / Slide Form', RAIL_ON.map(o => [o, railOnName({approach:F.approach, on:o})]));
    add('swap', 'Swap', [['','–'], ...RAIL_SWAP]);
    f.push(`<div class="form-group"><label>Transfer</label><select onchange="${fn}('transfer', this.value==='__add__' ? (prompt('New transfer:')||'') : this.value)">${opts([['','–'], ...transfers, ...(F.transfer && !transfers.includes(F.transfer) ? [F.transfer] : []), ['__add__','＋ Add new…']], F.transfer)}</select></div>`);
    add('out', 'Out-Spin', RAIL_OUT);
    const so = railSpinOut(F);
    add('outSide', 'Out Side', [['FS','Frontside'],['BS','Backside']], so);
    add('foot', 'Foot', [['Right','Right Foot'],['Left','Left Foot']], so);
    add('outStyle', 'Out Style', [['','Spin'],['flip','Flip / Cork']], so);
  } else {
    f.push('<div class="section-divider">Halfpipe</div>');
    add('kind', 'Type', [['air','Air / Spin'],['basic','Basics']]);
    if (F.kind==='basic'){
      add('basic', 'Basic', HP_BASICS);
      add('side', 'Side', [['L','Left'],['R','Right']], /drop in/i.test(F.basic));
    } else {
      add('dir', 'Direction', [['L','Left'],['R','Right']]);
      add('sw', 'Stance', [['','Forward'],['1','Switch']]);
      add('ao', 'Alley-oop', [['','No (down the pipe)'],['1','Yes']]);
      add('flips', 'Flips', [['1','Single'],['2','Double'],['3','Triple']], ['Cork','Bio/Misty','Flat Spin','Rodeo'].includes(F.axis));
      add('axis', 'Axis', [{group:'Off-Axis', items:[['Cork','Cork'],['Bio/Misty','Bio/Misty'],['Flat Spin','Flat Spins'],['Rodeo','Rodeo'],['Flair','Flair']]},
        {group:'Upright Spins (Longitudinal Axis)', items:[['Upright','Upright Spins']]}]);
      add('rot', 'Rotation', [['0','– (straight / flair)'], ...rotList(180, 1620)]);
      f.push(`<div class="form-group"><label>Air Height (m)</label><input type="number" step="0.5" min="0" max="8" value="${esc(F.height)}" oninput="${fn}('height', this.value, true)" placeholder="e.g. 3.5"></div>`);
      grabBlock();
      add('bringback', 'Bring Back', [['','–'],'180','360','540']);
      add('style', 'Style Element', [['','–'],'Tweak/Bone','Poke']);
    }
  }
  return f.join('');
}
// Grab-Button: nochmals klicken = abwählen
function F_GRAB(i, cur){ const g = GRABS[i]; return cur===g ? '' : g; }

function normTrick(disc, F){
  if (disc==='Jump'){
    const noRot = NOROT.includes(F.axis);
    return {axis:F.axis, dir:F.dir, flips:OFFAX.includes(F.axis) ? +F.flips||1 : null, rot:noRot ? null : +F.rot, grab:F.grab||'', takeoff:F.takeoff||'', bringback:F.bringback||'', style:F.style||''};
  }
  if (disc==='Rail'){
    const so = railSpinOut(F);
    return {railType:F.railType, obstacle:railLevel(F.railType), transfer:F.transfer||'', side:F.side, approach:F.approach, on:F.on, swap:F.swap||'', out:F.out, outSide:so?F.outSide:'', foot:so?F.foot:'', outStyle:so?F.outStyle:''};
  }
  if (F.kind==='basic') return {kind:'basic', basic:F.basic, side:/drop in/i.test(F.basic) ? F.side : ''};
  return {kind:'air', dir:F.dir, sw:!!F.sw, ao:!!F.ao, axis:F.axis, flips:['Cork','Bio/Misty','Flat Spin','Rodeo'].includes(F.axis) ? +F.flips||1 : null, rot:+F.rot||0, grab:F.grab||'', height:F.height===''?null:+F.height, bringback:F.bringback||'', style:F.style||''};
}
function trickToForm(disc, t){
  const F = {...FORM_DEFAULTS[disc]};
  for (const [k, v] of Object.entries(t||{})) F[k] = v === true ? '1' : v === false || v == null ? '' : String(v);
  if (disc==='Jump' && !F.flips) F.flips = '1';
  if (disc==='Rail' && !(t||{}).railType) F.railType = ({'Tube':'Tube', 'Tube / Box':'Tube', 'Simple rail':'Rail', 'Demanding rail':'Down Rail'})[t?.obstacle] || 'Tube';
  if (disc==='Halfpipe' && !F.flips) F.flips = '1';
  return F;
}

function openForm(entryId){
  const e = entryId && ST.entries.find(x => x.id===entryId);
  ST.form = e ? {id:e.id, disc:e.discipline, F:trickToForm(e.discipline, e.trick), note:e.note||'', status:e.status, date:(e.created_at||'').slice(0,10)}
              : {id:null, disc:ST.disc||'Jump', F:{...FORM_DEFAULTS[ST.disc||'Jump']}, note:'', status:null, date:todayIso()};
  ST.pendingFile = null;
  renderAssessment();
  document.getElementById('form-card')?.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeForm(){ ST.form = null; ST.pendingFile = null; renderAssessment(); }
function formDisc(d){ ST.form.disc = d; ST.disc = d; ST.form.F = {...FORM_DEFAULTS[d]}; renderFormInner(); }
function applyFormValue(disc, F, k, v){
  F[k] = v;
  if (disc==='Jump' && k==='axis'){
    const noRot = NOROT.includes(v);
    if (noRot && !['F','S'].includes(F.dir)) F.dir = isSw(F) ? 'S' : 'F';
    if (!noRot && !D4.includes(F.dir)) F.dir = F.dir==='S' ? 'SL' : 'L';
  }
}
function formSet(k, v, noRerender){
  applyFormValue(ST.form.disc, ST.form.F, k, v);
  if (noRerender) renderFormPreview(); else renderFormInner();
}
function renderFormPreview(){
  const box = $('#f-preview'); if (!box) return;
  const ath = prof(ST.athleteId); const disc = ST.form.disc;
  const t = normTrick(disc, ST.form.F);
  const all = ath?.gender ? directMatches(disc, ath.gender, t) : [];
  const m = isStaff() ? all : all.filter(x => x.level===ath.level);   // Athlet:innen: nur eigene Stufe
  const mine = m.filter(x => x.level===ath.level), other = m.filter(x => x.level!==ath.level);
  box.innerHTML = `<div class="lbl">${esc(trickLabel(disc, t))}</div>
    ${!ath?.gender ? '<div class="muted">Set gender & level for this athlete (Team tab) to see the Skills-Check match.</div>'
      : m.length ? `<div class="muted tiny" style="margin-bottom:6px">SKILLS-CHECK MATCH</div><div class="chips">${mine.map(x => `<span class="chip dark">${x.level} · ${esc(x.text)}</span>`).join('')}${other.map(x => `<span class="chip">${x.level} · ${esc(x.text)}</span>`).join('')}</div>`
      : '<div class="muted">No Skills-Check requirement matches this trick — it is still saved as a free trick.</div>'}`;
}
function renderFormInner(){
  const card = $('#form-card'); if (!card) return;
  const fm = ST.form;
  $('#f-fields').innerHTML = formFields(fm.disc, fm.F);
  renderFormPreview();
}
function formCard(){
  const fm = ST.form; const staff = isStaff();
  const ath = prof(ST.athleteId);
  const hasVideo = fm.id && ST.entries.find(e => e.id===fm.id)?.video_path;
  return `<div class="card" id="form-card">
    <div class="card-title">${fm.id ? 'Edit Trick' : 'Add Trick'}${staff ? ` <span class="chip">${esc(ath?.name)}</span>` : ''}</div>
    <div class="form-grid">
      <div class="form-group"><label>Date</label><input type="date" id="f-date" value="${fm.date || todayIso()}" max="${todayIso()}" onchange="ST.form.date=this.value"></div>
      <div class="form-group full"><label>Discipline</label><select onchange="formDisc(this.value)" ${fm.id ? 'disabled' : ''}>${opts(DISCS.map(d => [d, d]), fm.disc)}</select></div>
    </div>
    <div class="form-grid" id="f-fields"></div>
    <div class="preview" id="f-preview"></div>
    <div class="form-grid" style="margin-top:12px">
      <div class="form-group full"><label>Video ${staff ? '(optional)' : 'for your coach'}</label>
        <div class="filebox">
          <input type="file" accept="video/*" id="f-video" onchange="ST.pendingFile=this.files[0]||null;$('#f-vname').textContent=ST.pendingFile?ST.pendingFile.name+' · '+(ST.pendingFile.size/1048576).toFixed(1)+' MB':''">
          <span class="muted small" id="f-vname">${hasVideo ? 'A video is already attached — choose a file to replace it.' : ''}</span>
        </div></div>
      <div class="form-group full"><label>Note (optional)</label><textarea id="f-note" placeholder="${staff ? 'Note for the athlete' : 'Anything your coach should know?'}">${esc(fm.note)}</textarea></div>
    </div>
    <div id="f-progress" hidden><div class="progress"><i></i></div><div class="tiny muted" id="f-progress-t">Uploading video…</div></div>
    <div class="sb-form-btns">
      ${staff ? `<button class="btn-mastered" onclick="submitForm('rate')">✓ LEARNED · RATE NOW</button>` : `<button class="btn-mastered" onclick="submitForm('pending')">✓ LEARNED · SUBMIT TO COACH</button>`}
      <button class="btn-goal" onclick="submitForm('goal')">🎯 GOAL / IN PROGRESS</button>
