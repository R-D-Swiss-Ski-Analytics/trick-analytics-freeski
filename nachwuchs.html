async function submitForm(mode){
  const fm = ST.form; const staff = isStaff();
  const note = $('#f-note').value.trim();
  const trick = normTrick(fm.disc, fm.F);
  const prev = fm.id ? ST.entries.find(e => e.id===fm.id) : null;
  if (prev && prev.status==='reviewed' && !staff){ toast('Rated tricks can only be changed by your coach.', true); return; }
  const status = mode==='goal' ? 'goal' : (mode==='rate' ? (prev?.status==='reviewed' ? 'reviewed' : 'pending') : 'pending');
  const trickChanged = prev && JSON.stringify(prev.trick) !== JSON.stringify(trick);
  const e = {...(prev||{}), id:prev?.id || uid(), athlete_id:ST.athleteId, discipline:fm.disc, trick, label:trickLabel(fm.disc, trick), status, note};
  const d = $('#f-date')?.value || todayIso();
  if (!prev || (prev.created_at||'').slice(0,10) !== d) e.created_at = d===todayIso() ? nowIso() : new Date(d + 'T12:00:00').toISOString();
  if (!prev || trickChanged || status !== 'reviewed'){ e.crit = null; e.score = null; }
  if (!staff && (status==='pending' || status==='goal')){ delete e.crit; delete e.score; }
  const btns = document.querySelectorAll('#form-card .btn'); btns.forEach(b => b.disabled = true);
  try {
    let saved = await Store.saveEntry(ST.me, e);
    upsertLocal(saved);
    if (ST.pendingFile){
      $('#f-progress').hidden = false;
      try {
        const path = await Store.uploadVideo(ST.me, saved, ST.pendingFile, p => { $('#f-progress i').style.width = p + '%'; $('#f-progress-t').textContent = `Uploading video… ${p}%`; });
        saved = await Store.saveEntry(ST.me, {...saved, video_path:path});
        upsertLocal(saved);
      } catch (err){
        console.error(err); toast('Trick saved, but the video upload failed — try again via «Upload video».', true);
      }
    }
    ST.form = null; ST.pendingFile = null;
    if (mode==='rate'){ renderAssessment(); openReview(saved.id); }
    else { toast(status==='goal' ? 'Saved as goal' : staff ? 'Saved to review inbox' : 'Sent to your coach 👍'); render(); }
  } catch (err){
    console.error(err); toast('Could not save: ' + (err.message || err), true);
    btns.forEach(b => b.disabled = false);
  }
}
function upsertLocal(row){ ST._rev = (ST._rev||0) + 1; _evalCache.clear(); const i = ST.entries.findIndex(x => x.id===row.id); if (i >= 0) ST.entries[i] = row; else ST.entries.unshift(row); }

  const e = ST.entries.find(x => x.id===id);

function pickVideo(id){

// Fokus ab T4: nur Halfpipe ('hp') oder nur Jumps + Rails ('park'); darunter zählen immer alle drei.
const FOCUS = {'':'All disciplines', park:'Jumps & Rails only', hp:'Halfpipe only'};
const FOCUS_DISCS = {park:['Jump','Rail'], hp:['Halfpipe']};
const focusDiscs = (ath, level) => level==='T4' && FOCUS_DISCS[ath.focus] ? FOCUS_DISCS[ath.focus] : DISCS;
function levelTotals(ath, level){
  const ents = entriesOf(ath.id);
  const incl = focusDiscs(ath, level);
  const r = {pts:0, max:0, done:0, n:0, pending:0, by:{}, incl};
  for (const d of DISCS){
    const ev = evaluate(d, ath.gender, level, ents); if (!ev) continue;
    r.by[d] = ev;
    if (!incl.includes(d)) continue;
    r.pts += ev.pts; r.max += ev.max; r.done += ev.done; r.n += ev.n; r.pending += ev.pending;
  }
  // Total: jede zählende Disziplin gleich gewichtet (⅓ bzw. ½ bzw. ganz) — unabhängig von der Anzahl Vorgaben
  const parts = incl.map(d => r.by[d]).filter(ev => ev && ev.max > 0).map(ev => ev.pts / ev.max);
  r.pct = parts.length ? Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100) : 0;
  return r;
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function progressBar(ev){
  const part = Object.values(ev.out).filter(o => o.state==='partial').reduce((s, o) => s + o.pts, 0);
  const full = ev.pts - part;
  return `<div class="bar"><i class="b-done" style="width:${pct(full, ev.max)}%"></i><i class="b-part" style="width:${pct(part, ev.max)}%"></i></div>`;
}

        <div class="tiny muted" style="margin-top:6px">${tot.incl.length===3 ? 'Jumps, Rails & Halfpipe count ⅓ each' : `Focus: ${FOCUS[ath.focus]}`} · ${tot.done} of ${tot.n} fully achieved${tot.pending?` · ${tot.pending} waiting`:''}</div></div>

        <div class="k">${DISC_LABEL[d]} · ${on ? ['','1','½','⅓'][tot.incl.length] : 'not in focus'}</div><div class="v">${pct(e2.pts, e2.max)}<small>% · ${e2.pts}/${e2.max} pts</small></div>${progressBar(e2)}
        <div class="tiny muted" style="margin-top:6px">${e2.done}/${e2.n} achieved${e2.pending?` · ${e2.pending} ⏳`:''}</div></div>`; }).join('')}

    </div>`;
}

}
function toggleCrit(k){ const v = RV.crit[k]; RV.crit[k] = v===null ? true : v===true ? false : true; renderCrit(); }
async function saveReview(kind){

/* ══════════════════════════════════════════════════════════════════════
   GEMEINSAMES FÜR SESSION / REPORTS / MONITORING
   Qualität eines Versuchs = erfüllte Kriterien / max (in %), Sturz = 0 %.
   Status wie Freeski-Monitoring: ≥70 Ready · 50–69 Building · <50 Critical · <5 Versuche Low data
   ══════════════════════════════════════════════════════════════════════ */
const SESS_TYPES = [['Landing Bag','Jump'], ['Big Air Training','Jump'], ['Big Air Competition','Jump'], ['Slopestyle Training','Jump'], ['Slopestyle Competition','Jump'], ['Halfpipe Training','Halfpipe'], ['Halfpipe Competition','Halfpipe']];
const LEGACY_TYPES = {'Jump Training':'Big Air Training', 'Rail Training':'Slopestyle Training', 'Competition':'Big Air Competition'};   // frühere Youth-Typen
const normType = t => LEGACY_TYPES[t] || t;
const typeDisc = t => (SESS_TYPES.find(x => x[0]===normType(t)) || [])[1] || 'Jump';
const isComp = t => /Competition/.test(normType(t));
const isRunType = t => /^(Slopestyle|Halfpipe)/.test(normType(t));
const todayIso = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const qa = a => a.fell ? 0 : !a.crit && a.outcome ? (a.outcome==='stomped' ? 100 : 60) : Math.round((a.score||0) / (a.max || maxFor(a.discipline)) * 100);   // Run-Elemente ohne Kriterien: ✓ = 60 %, ★ = 100 %
const avg = arr => arr.length ? Math.round(arr.reduce((s, x) => s + x, 0) / arr.length) : null;
const landedPct = list => list.length ? Math.round(list.filter(a => !a.fell).length / list.length * 100) : null;
const qChip = v => v==null ? '<span class="chip">–</span>' : `<span class="chip ${v>=70?'green':v>=50?'gold':'red'}">${v}%</span>`;
const fmtShort = iso => iso ? new Date(iso).toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit'}) : '';
const sessById = id => ST.sessions.find(s => s.id===id);
const sessDate = a => sessById(a.session_id)?.date || a.created_at.slice(0,10);
const sessAttempts = id => ST.attempts.filter(a => a.session_id===id);
function activeSession(){ return ST.sessions.find(s => !s.ended_at && s.created_by===ST.me.id) || null; }
function upsertIn(list, row){ const i = list.findIndex(x => x.id===row.id); if (i >= 0) list[i] = row; else list.unshift(row); }
function statusOf(n, v){
  if (n < 5) return {k:'low', label:'Low data', cls:''};
  if (v >= 70) return {k:'ready', label:'Ready', cls:'green'};
  if (v >= 50) return {k:'building', label:'Building', cls:'gold'};
  return {k:'critical', label:'Critical', cls:'red'};
}
const statusChipOf = (n, v) => { const s = statusOf(n, v); return `<span class="chip ${s.cls}">${s.label}</span>`; };
// Kern-Trick ohne Grab (Grab-Varianten werden im Monitoring zusammengefasst)
function coreOf(a){
  const label = a.discipline==='Rail' ? a.label : trickLabel(a.discipline, {...a.trick, grab:''});
  return {key:`${a.discipline}|${label}`, label};
}
// Ø der letzten 3 Sessions (Basis für den Status)
function recentAvg(list, nSess=3){
  const ids = [...new Set(list.map(a => a.session_id))].sort((x, y) => (sessById(x)?.date||'').localeCompare(sessById(y)?.date||''));
  const keep = new Set(ids.slice(-nSess));
  return avg(list.filter(a => keep.has(a.session_id)).map(qa));
}
function critRates(list, disc){
  return critSetFor(disc).map(c => ({k:c.k, name:c.name, pct: list.length ? Math.round(list.filter(a => !a.fell && a.crit?.[c.k]).length / list.length * 100) : null}));
}
const CRIT_COLORS = ['#396FA8','#8E5BB8','#C96A1F','#1F9E93','#B08D1E'];
const PERIODS = [['season','Season'], ['30','Last 30 days'], ['all','All time']];
function periodStart(p){
  if (p==='all') return '';
  if (p==='30') return new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
  const d = new Date(); const y = d.getMonth() >= 4 ? d.getFullYear() : d.getFullYear() - 1;   // Saison 1. Mai – 30. April
  return `${y}-05-01`;
}
const visGroupAthleteIds = () => new Set(visibleAthletes().map(a => a.id));

/* ── Diagramme: SVG in der tatsächlichen Containerbreite, alle mit Achsenbeschriftung ── */
const CHARTS = [];
function chartSlot(draw){ const id = 'ch' + CHARTS.length + '-' + Math.random().toString(36).slice(2,6); CHARTS.push({id, draw}); return `<div class="chart" id="${id}"></div>`; }
function drawCharts(){ for (const c of CHARTS){ const el = document.getElementById(c.id); if (el) el.innerHTML = c.draw(Math.max(el.clientWidth, 280)); } }
let _rsT; window.addEventListener('resize', () => { clearTimeout(_rsT); _rsT = setTimeout(drawCharts, 150); });
function axes(W, H, pad, yTitle, xTitle){
  const ih = H - pad.t - pad.b; let s = '';
  for (const t of [0, 25, 50, 75, 100]){
    const y = pad.t + ih * (1 - t/100);
    s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="${t===0?'#bdb6b3':'#ece8e6'}"/><text x="${pad.l - 6}" y="${y + 3.5}" text-anchor="end" font-size="11" fill="#6b6b70">${t}%</text>`;
  }
  s += `<text transform="translate(13 ${pad.t + ih/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#6b6b70">${esc(yTitle)}</text>`;
  s += `<text x="${pad.l + (W - pad.l - pad.r)/2}" y="${H - 5}" text-anchor="middle" font-size="11" fill="#6b6b70">${esc(xTitle)}</text>`;
  return s;
}
// bars: [{v (0–100), label, top, red, title}] · o.line: laufender Durchschnitt
function barChart(bars, o={}){
  return chartSlot(W0 => {
    const H = o.h || 200, pad = {l:46, r:12, t:20, b:42};
    const n = Math.max(bars.length, 1);
    const slotW = Math.max(14, Math.min(64, (W0 - pad.l - pad.r) / n));
    const W = Math.max(W0, pad.l + pad.r + slotW * n);
    const ih = H - pad.t - pad.b, y = v => pad.t + ih * (1 - v/100);
    const bw = Math.min(slotW * 0.68, 34), every = slotW < 26 ? Math.ceil(26 / slotW) : 1;
    const x0 = pad.l + Math.max(0, (W - pad.l - pad.r - slotW * n) / 2);
    let s = axes(W, H, pad, o.yTitle || 'Quality', o.xTitle || 'Attempts');
    const run = []; let sum = 0;
    bars.forEach((b, i) => {
      const x = x0 + i * slotW + (slotW - bw)/2, v = Math.max(0, Math.min(100, b.v||0));
      const col = b.col ? b.col : b.red ? '#D64545' : v >= 70 ? '#3E8E5A' : v >= 50 ? '#B08D1E' : '#D64545';
      s += `<g><title>${esc(b.title || '')}</title>`;
      if (b.red) s += `<text x="${x + bw/2}" y="${y(0) - 5}" text-anchor="middle" font-size="13" font-weight="800" fill="#D64545">✗</text>`;
      else s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(ih * v/100, 2)}" rx="3" fill="${col}" opacity="${b.fade?0.55:1}"/>`;
      if (b.top != null) s += `<text x="${x + bw/2}" y="${(b.red ? y(0) - 20 : y(v) - 5)}" text-anchor="middle" font-size="10.5" fill="#3E3E3F">${esc(b.top)}</text>`;
      if (b.label && i % every === 0) s += `<text x="${x + bw/2}" y="${H - pad.b + 15}" text-anchor="middle" font-size="10.5" fill="#6b6b70">${esc(b.label)}</text>`;
      s += '</g>';
      sum += v; run.push([x + bw/2, y(sum / (i + 1))]);
    });
    if (o.line && run.length > 1) s += `<polyline fill="none" stroke="#3E3E3F" stroke-width="2" stroke-dasharray="4 3" points="${run.map(p => p.join(',')).join(' ')}"/>`;
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
  });
}
// series: [{name, color, values:[v|null]}]
function lineChart(series, xlabels, o={}){
  const legend = `<div class="legend" style="margin-top:6px">${series.map(se => `<span><i class="dot" style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`;
  return chartSlot(W0 => {
    const H = o.h || 210, pad = {l:46, r:16, t:14, b:42};
    const n = xlabels.length, step = Math.max(34, (W0 - pad.l - pad.r - 24) / Math.max(n - 1, 1));
    const W = Math.max(W0, pad.l + pad.r + 24 + step * (n - 1));
    const ih = H - pad.t - pad.b, y = v => pad.t + ih * (1 - v/100);
    const x = i => n === 1 ? pad.l + (W - pad.l - pad.r)/2 : pad.l + 12 + i * step;
    let s = axes(W, H, pad, o.yTitle || 'Criteria achieved', o.xTitle || 'Sessions');
    xlabels.forEach((l, i) => s += `<text x="${x(i)}" y="${H - pad.b + 15}" text-anchor="middle" font-size="10.5" fill="#6b6b70">${esc(l)}</text>`);
    series.forEach((se, si) => {
      const off = (si - (series.length - 1)/2) * 2.5;
      const pts = se.values.map((v, i) => v == null ? null : [x(i) + off, y(v), v]).filter(Boolean);
      if (pts.length > 1) s += `<polyline fill="none" stroke="${se.color}" stroke-width="2" points="${pts.map(p => p[0]+','+p[1]).join(' ')}"/>`;
      s += pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${se.color}"><title>${esc(se.name)}: ${p[2]}%</title></circle>`).join('');
    });
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
  }) + legend;
}

/* ══════════════════════════════════════════════════════════════════════
   SESSION — Live-Erfassung im Training (Coach / DVLP)
   Jeder Versuch wird sofort gespeichert; die laufende Session liegt in der
   DB (ended_at leer) und wird nach Reload / auf anderem Gerät fortgesetzt.
   ══════════════════════════════════════════════════════════════════════ */
const sxFresh = (o={}) => ({setup:null, athleteId:null, pick:null, crit:null, form:null, cands:[], editAth:false, mode:null, fails:new Set(), comment:'', reasons:[], grab:'', runs:{}, runNote:null, ...o});
let SX = sxFresh();
// Bewertung wie Snowboard: FAILED (Gründe, Mehrfachauswahl) oder LANDED (erfüllte Kriterien als ⭐; alle = Stomped).
// Fail-Gründe werden wie im Snowboard als «Tags: …» vorne in der Notiz gespeichert.
const FAIL_REASONS = ['Timing rotation','Position Take-off','Spin power','Air Position','Timing Grab','Spotting'];
const parseTags = note => { const m = /^Tags: ([^|]*)/.exec(note || ''); return m ? m[1].split(',').map(x => x.trim()).filter(Boolean) : []; };
const noteText = note => (note || '').replace(/^Tags: [^|]*(\|\s*)?/, '').trim();
const outcomeOf = a => a.fell ? 'failed' : a.outcome && !a.crit ? a.outcome : a.score === (a.max || maxFor(a.discipline)) ? 'stomped' : 'landed';
function failReasonList(){
  const custom = new Set();
  ST.attempts.forEach(a => parseTags(a.note).forEach(t => { if (!FAIL_REASONS.includes(t)) custom.add(t); }));
  SX.fails.forEach(t => { if (!FAIL_REASONS.includes(t)) custom.add(t); });
  return [...FAIL_REASONS, ...[...custom].sort()];
}
function sxMode(m){ SX.mode = SX.mode===m ? null : m; SX.fails = new Set(); SX.crit = null; renderSession(); }
function sxCrit(k){ SX.crit[k] = !SX.crit[k]; renderSession(); }
function sxFail(i){ const r = SX.reasons[i]; SX.fails.has(r) ? SX.fails.delete(r) : SX.fails.add(r); renderSession(); }
function sxFailOther(){ const r = (prompt('New fail reason:') || '').trim(); if (r){ SX.fails.add(r); renderSession(); } }

function renderSession(){
  const root = $('#page-session');
  const s = activeSession();
  if (!s) return renderSessionSetup(root);
  renderSessionActive(root, s);
}
function renderSessionSetup(root){

// Kandidaten wie Freeski: Kern-Trick (ohne Grab) aus Session + Assessment; Grab wird pro Versuch gewählt
function sxCandidates(s, atts){
  const cands = [], seen = new Set();
  const push = (src, disc, trick) => {
    const core = disc==='Rail' || trick?.kind==='basic' ? {...trick} : {...trick, grab:''};
    const label = trickLabel(disc, core), k = disc + '|' + label;
    if (seen.has(k)) return; seen.add(k); cands.push({src, disc, trick:core, label, key:k});
  };
  atts.filter(a => a.athlete_id===SX.athleteId && !a.run_no).forEach(a => push('session', a.discipline, a.trick));
  const d0 = typeDisc(s.type);
  entriesOf(SX.athleteId).sort((a,b) => (a.discipline===d0 ? 0 : 1) - (b.discipline===d0 ? 0 : 1) || (+(b.trick?.rot)||0) - (+(a.trick?.rot)||0))
    .forEach(e => push(e.status==='goal' ? 'goal' : 'assessment', e.discipline, e.trick));
  return cands;
}
const hasGrab = pk => pk && pk.disc!=='Rail' && pk.trick?.kind!=='basic';
// Grabs, die zu diesem Kern-Trick passen: aus dem Assessment (Goals markiert) + bereits geloggt
function sxGrabOptions(pk){
  const m = new Map();
  entriesOf(SX.athleteId).forEach(e => { if (e.discipline===pk.disc && e.trick?.grab && trickLabel(e.discipline, {...e.trick, grab:''})===pk.label) m.set(e.trick.grab, m.get(e.trick.grab)==='assessment' ? 'assessment' : (e.status==='goal' ? 'goal' : 'assessment')); });
  ST.attempts.forEach(a => { if (a.athlete_id===SX.athleteId && a.discipline===pk.disc && a.trick?.grab && coreOf(a).label===pk.label && !m.has(a.trick.grab)) m.set(a.trick.grab, 'session'); });
  if (SX.grab && !m.has(SX.grab)) m.set(SX.grab, 'session');
  return [...m.entries()];
}
function sxGrabTap(g){
  // wie Freeski: zweiter Grab-Tipp = Doppelgrab «A to B»; nochmals tippen = zurück
  if (!g) SX.grab = '';
  else if (SX.grab===g) SX.grab = '';
  else if (SX.grab && !SX.grab.includes(' to ')) SX.grab = `${SX.grab} to ${g}`;
  else SX.grab = g;
  renderSession();
}
function sxGrabOther(v){ if (v) { SX.grab = v; renderSession(); } }
const pickedTrick = () => ({...SX.pick.trick, ...(hasGrab(SX.pick) ? {grab:SX.grab || ''} : {})});

let _ac;
function logSound(){ // kurzer Blip wie in der Freeski-App
  try {
    _ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = 'sine'; o.frequency.value = 520;
    g.gain.setValueAtTime(.15, _ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, _ac.currentTime + .18);
    o.connect(g).connect(_ac.destination); o.start(); o.stop(_ac.currentTime + .2);
  } catch {}
}

function sxPick(i){
  SX.pick = {...SX.cands[i]}; SX.crit = null; SX.form = null; SX.mode = null; SX.fails = new Set();

// ── Run-Builder (Slopestyle / Halfpipe) wie Freeski: Run zusammenstellen, jedes Element ✗ / ✓ / ★
const RAIL_TYPES = ['Box','Tube','Rail','Down Tube','Down Rail','Single Kink','Double Kink','Cannon','Gap to Rail','DFD','Flat-Down','Waterfall','Ellbow','S-Rail','C-Rail','Pole-Jam'];
const runKey = () => `nw-run-${activeSession()?.id}-${SX.athleteId}`;
function runState(){
  SX.runs ||= {};
  const k = runKey();
  if (!SX.runs[k]){ let r = null; try { r = JSON.parse(localStorage.getItem(k)); } catch {} SX.runs[k] = r || {n:1, els:[], rail:{type:'Rail', text:''}}; }
  return SX.runs[k];
}
function runSave(){ try { localStorage.setItem(runKey(), JSON.stringify(runState())); } catch {} }
const runMax = s => typeDisc(s.type)==='Halfpipe' ? 10 : 8;
function runAddPicked(){
  const s = activeSession(), r = runState();
  if (r.els.length >= runMax(s)){ toast(`Max. ${runMax(s)} elements per run`, true); return; }
  const t = pickedTrick();
  r.els.push({disc:SX.pick.disc, trick:t, label:trickLabel(SX.pick.disc, t), rate:null, tags:[], note:''});
  runSave(); renderSession();
}
function runAddRail(){
  const s = activeSession(), r = runState(), txt = (document.getElementById('run-rail-text')?.value || '').trim();
  if (!txt){ toast('Enter the rail trick', true); return; }
  if (r.els.length >= runMax(s)){ toast(`Max. ${runMax(s)} elements per run`, true); return; }
  r.els.push({disc:'Rail', trick:{railType:r.rail.type, text:txt, free:true}, label:`Rail ${r.rail.type} — ${txt}`, rate:null, tags:[], note:''});
  r.rail.text = ''; runSave(); renderSession();
}
function runRate(i, v){ const e = runState().els[i]; e.rate = e.rate===v ? null : v; runSave(); renderSession(); }
function runRemove(i){ runState().els.splice(i, 1); runSave(); renderSession(); }
function runToggleTag(i, t){ const e = runState().els[i]; e.tags = e.tags.includes(t) ? e.tags.filter(x => x!==t) : [...e.tags, t]; runSave(); renderSession(); }
function runOpenNote(i){ SX.runNote = SX.runNote===i ? null : i; renderSession(); }
function runRailType(t){ runState().rail.type = t; runSave(); renderSession(); }
function runRailNew(){ const t = (prompt('New rail type:') || '').trim(); if (t){ runState().rail.type = t; runSave(); renderSession(); } }

      <div class="failchips">${[...RAIL_TYPES, ...customRails].map(t => `<button class="failchip ${r.rail.type===t?'on':''}" onclick="runRailType(${esc(JSON.stringify(t))})">${esc(t)}</button>`).join('')}<button class="failchip add" onclick="runRailNew()">+ New</button></div>

async function runSaveAll(){
  const s = activeSession(), r = runState(), N = r.els.length;
  try {
    for (const [i, e] of r.els.entries()){
      const note = [e.tags.length ? 'Tags: ' + e.tags.join(', ') : '', `Run ${r.n} · ${i + 1}/${N}`, e.note].filter(Boolean).join(' | ');
      const a = {id:uid(), session_id:s.id, athlete_id:SX.athleteId, discipline:e.disc, trick:e.trick, label:e.label, crit:null, score:null,
        max:maxFor(e.disc), fell:e.rate==='failed', outcome:e.rate, run_no:r.n, note, entry_id:null, created_at:new Date(Date.now() + i).toISOString(), created_by:ST.me.id};
      upsertIn(ST.attempts, await Store.saveAttempt(ST.me, a));
    }
    logSound(); toast(`Run #${r.n} saved`);
    r.n++; r.els.forEach(e => { e.rate = null; e.tags = []; e.note = ''; });   // Layout bleibt für den nächsten Run
    runSave(); renderSession();
  } catch (err){ console.error(err); toast('Could not save run: ' + (err.message||err), true); }
}
function sxOpenForm(){ const d = SX.pick?.disc || typeDisc(activeSession().type); SX.form = {disc:d, F:{...FORM_DEFAULTS[d]}}; renderSession(); }

function sxFormSet(k, v, noRerender){

  if (noRerender){ const l = $('#sx-lbl'); if (l) l.textContent = trickLabel(SX.form.disc, normTrick(SX.form.disc, SX.form.F)); }
  else renderSession();
}
function sxUseForm(){
  const t = normTrick(SX.form.disc, SX.form.F), d = SX.form.disc;
  const core = d==='Rail' || t.kind==='basic' ? t : {...t, grab:''};
  SX.pick = {src:'new', disc:d, trick:core, label:trickLabel(d, core), key:d + '|' + trickLabel(d, core)}; SX.grab = t.grab || '';
  SX.form = null; SX.crit = null; renderSession();
}
async function sxSessAth(id){
  const s = activeSession(); let ids = [...s.athlete_ids];
  if (ids.includes(id)){
    if (sessAttempts(s.id).some(a => a.athlete_id===id)){ toast('This athlete already has attempts in this session.', true); return; }
    if (ids.length === 1){ toast('A session needs at least one athlete.', true); return; }
    ids = ids.filter(x => x!==id);
  } else ids.push(id);
  try { upsertIn(ST.sessions, await Store.saveSession(ST.me, {...s, athlete_ids:ids})); renderSession(); }
  catch (err){ toast('Could not save: ' + (err.message||err), true); }
}
async function logAttempt(fell){
  const s = activeSession(), pk = SX.pick, set = critSetFor(pk.disc);
  const crit = fell ? Object.fromEntries(set.map(c => [c.k, false])) : {...SX.crit};
  const fails = fell ? [...SX.fails] : [];
  const note = [fails.length ? 'Tags: ' + fails.join(', ') : '', (SX.comment || '').trim()].filter(Boolean).join(' | ') || null;
  const t = pickedTrick();
  const score = fell ? 0 : Object.values(crit).filter(Boolean).length;
  const a = {id:uid(), session_id:s.id, athlete_id:SX.athleteId, discipline:pk.disc, trick:t, label:trickLabel(pk.disc, t), crit,
    score, max:set.length, fell, outcome: fell ? 'failed' : score===set.length ? 'stomped' : 'landed', note, entry_id:null, created_at:nowIso(), created_by:ST.me.id};
  try {
    upsertIn(ST.attempts, await Store.saveAttempt(ST.me, a));
    SX.crit = null; SX.mode = null; SX.fails = new Set(); SX.comment = '';
    logSound();
    const o = outcomeOf(a);
    toast(o==='failed' ? 'Failed logged' : o==='stomped' ? '⭐ Stomped!' : `Landed ${a.score}/${a.max}`); renderSession();
  } catch (err){ console.error(err); toast('Could not save attempt: ' + (err.message||err), true); }
}
function attemptRow(a, o={}){
  const mx = a.max || maxFor(a.discipline), oc = outcomeOf(a);
  const missed = a.crit && !a.fell ? critSetFor(a.discipline).filter(c => a.crit[c.k] === false) : [];
  const res = oc==='failed' ? '<span class="chip red">✗ Failed</span>' + parseTags(a.note).map(t => `<span class="chip">${esc(t)}</span>`).join('')
    : oc==='stomped' ? `<span class="chip teal">⭐ Stomped${a.crit ? ` · ${mx}/${mx}` : ''}</span>`
    : `<span class="chip green">✓ Landed${a.crit ? ` · ${stars(a.score, mx)} ${a.score}/${mx}` : ''}</span>`;
  return `<div class="item">
    <div class="main"><div class="t">${esc(a.label)}</div>
      <div class="m">${o.noName ? '' : esc(prof(a.athlete_id)?.name) + ' · '}${o.withDate ? fmtDate(sessDate(a)) + ' · ' : ''}${new Date(a.created_at).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'})}${a.run_no ? ` · Run ${a.run_no}` : ''}</div>
      <div class="chips">${res}${missed.map(c => `<span class="chip">✗ ${esc(c.name)}</span>`).join('')}${a.entry_id ? '<span class="chip dark">✓ in Skills-Check</span>' : ''}</div>
      ${noteText(a.note) ? `<div class="small" style="margin-top:6px">💬 ${esc(noteText(a.note))}</div>` : ''}</div>
    <div class="acts noprint">${!a.fell && a.crit && !a.entry_id ? `<button class="btn ghost sm" onclick="attemptToSkills('${a.id}')" title="Use this rating in the athlete's Skills-Check">→ Skills-Check</button>` : ''}<button class="btn ghost sm" onclick="editAttempt('${a.id}')" title="Edit attempt">✏️</button><button class="btn ghost sm" onclick="deleteAttempt('${a.id}')" title="Delete attempt">🗑</button></div>
  </div>`;
}

// Versuch nachträglich bearbeiten (Session-Log, Report, Raw Entries, Monitoring)
let EA = null;
function editAttempt(id){
  const a = ST.attempts.find(x => x.id===id); if (!a) return;
  const set = critSetFor(a.discipline);
  EA = {id, oc:outcomeOf(a), crit: a.crit ? {...a.crit} : Object.fromEntries(set.map(c => [c.k, false])), hasCrit: !!a.crit,
    fails:new Set(parseTags(a.note)), comment:noteText(a.note), grab:a.trick?.grab || ''};
  renderEditAttempt();
}
function renderEditAttempt(){
  const a = ST.attempts.find(x => x.id===EA.id), set = critSetFor(a.discipline), score = Object.values(EA.crit).filter(Boolean).length;
  const grabbable = a.discipline!=='Rail' && a.trick?.kind!=='basic';
  const reasons = [...new Set([...failReasonList(), ...EA.fails])];
  modal(`<h3>Edit attempt</h3><div class="muted small">${esc(prof(a.athlete_id)?.name)} · ${fmtDate(sessDate(a))} · ${new Date(a.created_at).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'})}</div>
    <div style="font-weight:800;color:var(--char);font-size:16px;margin:10px 0">${esc(grabbable ? trickLabel(a.discipline, {...a.trick, grab:EA.grab}) : a.label)}</div>
    ${grabbable ? `<div class="form-group" style="margin-bottom:12px"><label>Grab</label><select onchange="EA.grab=this.value;renderEditAttempt()"><option value="">No grab</option>${opts([...new Set([...(EA.grab ? [EA.grab] : []), ...GRABS])], EA.grab)}</select></div>` : ''}
    <div class="bigbtns" style="${EA.hasCrit ? '' : 'grid-template-columns:1fr 1fr 1fr'}">
      <button class="bigbtn fail ${EA.oc==='failed'?'on':''}" onclick="EA.oc='failed';renderEditAttempt()">✗<br>FAILED</button>
      <button class="bigbtn land ${EA.oc!=='failed' && (EA.hasCrit || EA.oc==='landed')?'on':''}" onclick="EA.oc='landed';renderEditAttempt()">✓<br>LANDED</button>
      ${EA.hasCrit ? '' : `<button class="bigbtn land ${EA.oc==='stomped'?'on':''}" style="border-color:var(--cyan);color:var(--cyan)" onclick="EA.oc='stomped';renderEditAttempt()">★<br>STOMPED</button>`}
    </div>
    ${EA.oc!=='failed' && EA.hasCrit ? `<div class="disclose"><div class="row"><b style="color:var(--char)">Criteria met</b><span class="grow"></span><b>${score}/${set.length}</b></div>
      <div class="critstars">${set.map(c => `<button class="critstar ${EA.crit[c.k]?'on':''}" onclick="EA.crit['${c.k}']=!EA.crit['${c.k}'];renderEditAttempt()"><span class="st">⭐</span><span class="nm">${esc(c.name)}</span></button>`).join('')}</div></div>` : ''}
    ${EA.oc==='failed' ? `<div class="disclose"><b style="color:var(--char)">Reason(s)</b><div class="failchips">${reasons.map(r => `<button class="failchip ${EA.fails.has(r)?'on':''}" onclick="EA.fails.has(${esc(JSON.stringify(r))})?EA.fails.delete(${esc(JSON.stringify(r))}):EA.fails.add(${esc(JSON.stringify(r))});renderEditAttempt()">${esc(r)}</button>`).join('')}</div></div>` : ''}
    <div class="form-group" style="margin-top:12px"><label>Comment</label><input type="text" id="ea-comment" value="${esc(EA.comment)}" oninput="EA.comment=this.value"></div>
    <div class="btnrow"><button class="btn red" onclick="saveEditAttempt()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button><span class="grow"></span><button class="btn ghost" onclick="closeModal();deleteAttempt('${a.id}')">🗑 Delete</button></div>`);
}
async function saveEditAttempt(){
  const a = ST.attempts.find(x => x.id===EA.id), set = critSetFor(a.discipline);
  const fell = EA.oc==='failed';
  const trick = a.discipline!=='Rail' && a.trick?.kind!=='basic' ? {...a.trick, grab:EA.grab} : a.trick;
  const note = [fell && EA.fails.size ? 'Tags: ' + [...EA.fails].join(', ') : '', (EA.comment || '').trim()].filter(Boolean).join(' | ') || null;
  const next = {...a, trick, label: trick===a.trick ? a.label : trickLabel(a.discipline, trick), fell, note};
  if (EA.hasCrit){
    next.crit = fell ? Object.fromEntries(set.map(c => [c.k, false])) : {...EA.crit};
    next.score = fell ? 0 : Object.values(next.crit).filter(Boolean).length;
    next.outcome = fell ? 'failed' : next.score===set.length ? 'stomped' : 'landed';
  } else next.outcome = EA.oc;
  try { upsertIn(ST.attempts, await Store.saveAttempt(ST.me, next)); closeModal(); toast('Attempt updated'); render(); }
  catch (err){ toast('Could not save: ' + (err.message||err), true); }
}
async function deleteAttempt(id){
  if (!confirm('Delete this attempt?')) return;
  try { await Store.deleteAttempt(id); ST.attempts = ST.attempts.filter(a => a.id!==id); toast('Attempt deleted'); render(); }
  catch (err){ toast('Could not delete: ' + (err.message||err), true); }
}
// Ein im Training bewerteter Versuch zählt direkt im Skills-Check der Athlet:in.
async function attemptToSkills(id){
  const a = ST.attempts.find(x => x.id===id);
  if (!confirm(`Add «${a.label}» with ${a.score}/${a.max} to ${prof(a.athlete_id)?.name}'s Skills-Check?`)) return;
  try {
    let e = await Store.saveEntry(ST.me, {id:uid(), athlete_id:a.athlete_id, discipline:a.discipline, trick:a.trick, label:a.label, status:'goal', note:null});
    upsertLocal(e);
    e = await Store.review(ST.me, e.id, {status:'reviewed', crit:a.crit, score:a.score, review_note:`Rated in the session of ${fmtDate(sessDate(a))}`});
    upsertLocal(e);
    upsertIn(ST.attempts, await Store.saveAttempt(ST.me, {...a, entry_id:e.id}));
    toast('Added to the Skills-Check — athlete notified'); render();
  } catch (err){ console.error(err); toast('Could not add: ' + (err.message||err), true); }
}
async function cancelSession(){
  const s = activeSession(), n = sessAttempts(s.id).length;
  if (!confirm(n ? `Discard this session and all ${n} attempts?` : 'Discard this session?')) return;
  try { await Store.deleteSession(s.id); ST.sessions = ST.sessions.filter(x => x.id!==s.id); ST.attempts = ST.attempts.filter(a => a.session_id!==s.id); SX = sxFresh(); toast('Session discarded'); render(); }
  catch (err){ toast('Could not discard: ' + (err.message||err), true); }
}
function openEndSession(){
  const s = activeSession(), atts = sessAttempts(s.id);
  const mins = Math.max(30, Math.round((Date.now() - new Date(s.started_at)) / 1800000) * 30);
  const comp = isComp(s.type), nFinal = /^Slopestyle/.test(normType(s.type)) ? 2 : 3, res = s.results || {};
  const inp = (id, v) => `<input type="number" step="0.01" min="0" max="100" id="${id}" value="${v ?? ''}" style="width:72px;padding:6px 8px">`;
  modal(`<h3>Session Complete</h3><div class="muted small">${esc(normType(s.type))} · ${fmtDate(s.date)} · ${atts.length} attempts</div>
    <div class="form-grid" style="margin-top:14px">
      <div class="form-group"><label>Duration (min)</label><input type="number" id="es-dur" min="30" step="30" value="${s.duration_min || mins}"></div>
      <div class="form-group"><label>Location</label><input type="text" id="es-loc" value="${esc(s.location||'')}"></div>
      ${!isRunType(s.type) ? `<div class="form-group"><label>Jump Size</label><select id="es-size"><option value="">–</option>${opts(['M','L','XL'], s.jump_size||'')}</select></div>` : ''}
      <div class="form-group"><label>Conditions</label><select id="es-cond"><option value="">–</option>${opts([['1','1 · Poor'],['2','2'],['3','3 · OK'],['4','4'],['5','5 · Excellent']], s.conditions||'')}</select></div>
      <div class="form-group full"><label>Comments</label><textarea id="es-com" placeholder="Conditions, focus of the day …">${esc(s.comments||'')}</textarea></div>
    </div>
    ${comp ? `<div class="sub-h">Contest results <span class="rt">empty final = not reached</span></div>
      ${s.athlete_ids.map(id => { const r = res[id] || {};
        return `<div class="contest-row"><b>${esc(prof(id)?.name)}</b><div class="row" style="gap:6px"><span class="tiny muted">QUALI</span>${[0,1].map(i => inp(`es-q-${id}-${i}`, r.quali?.[i])).join('')}
          <span class="tiny muted">FINAL</span>${Array.from({length:nFinal}, (_, i) => inp(`es-f-${id}-${i}`, r.final?.[i])).join('')}
          <span class="tiny muted">RANK</span><input type="number" min="1" id="es-r-${id}" value="${r.rank ?? ''}" style="width:60px;padding:6px 8px"></div></div>`; }).join('')}` : ''}
    <div class="sub-h">Athlete notes</div>
    ${s.athlete_ids.map(id => `<div class="form-group" style="margin-top:8px"><label>${esc(prof(id)?.name)}</label><input type="text" id="es-note-${id}" value="${esc(s.athlete_notes?.[id]||'')}" placeholder="optional"></div>`).join('')}
    <div class="btnrow"><button class="btn red" onclick="endSession()">Save & Close</button><button class="btn ghost" onclick="closeModal()">Back to session</button></div>`);
}
async function endSession(){
  const s = activeSession(), atts = sessAttempts(s.id);
  try {
    if (!atts.length){
      await Store.deleteSession(s.id); ST.sessions = ST.sessions.filter(x => x.id!==s.id);
      closeModal(); SX = sxFresh(); toast('Empty session discarded'); render(); return;
    }
    const notes = {}, results = {};
    const num = id => { const v = document.getElementById(id)?.value; return v === '' || v == null ? null : +v; };
    s.athlete_ids.forEach(id => {
      const v = document.getElementById('es-note-' + id)?.value.trim(); if (v) notes[id] = v;
      if (isComp(s.type)){
        const quali = [0,1].map(i => num(`es-q-${id}-${i}`)), final = [0,1,2].map(i => num(`es-f-${id}-${i}`)), rank = num('es-r-' + id);
        if ([...quali, ...final, rank].some(x => x != null)) results[id] = {quali, final, rank};
      }
    });
    const row = {...s, duration_min:+$('#es-dur').value || null, location:$('#es-loc').value.trim() || null, conditions:+$('#es-cond').value || null,
      comments:$('#es-com').value.trim() || null, athlete_notes:notes, ended_at:nowIso()};
    if ($('#es-size')) row.jump_size = $('#es-size').value || null;
    if (isComp(s.type)) row.results = results;
    upsertIn(ST.sessions, await Store.saveSession(ST.me, row));
    try { Object.keys(localStorage).filter(k => k.startsWith('nw-run-' + s.id)).forEach(k => localStorage.removeItem(k)); } catch {}
    closeModal(); SX = sxFresh(); ST.rep.sel = s.id; go('reports'); toast('Session saved');
  } catch (err){ console.error(err); toast('Could not save: ' + (err.message||err), true); }
}

function reportSessions(){
  const vis = visGroupAthleteIds(), f = ST.rep, from = periodStart(f.period);
  return ST.sessions.filter(s => s.ended_at && s.athlete_ids.some(id => vis.has(id))
    && (!f.type || normType(s.type)===f.type) && (!f.athlete || s.athlete_ids.includes(f.athlete)) && (!from || s.date >= from))
    .sort((a,b) => b.date.localeCompare(a.date) || b.started_at.localeCompare(a.started_at));
}
function sessionListRow(s){
  const atts = sessAttempts(s.id);
  return `<div class="item click" onclick="ST.rep.sel='${s.id}';go('reports')">
    <div class="main"><div class="t">${fmtDate(s.date)} · ${esc(normType(s.type))}${s.jump_size ? ' · ' + esc(s.jump_size) : ''}</div>
      <div class="m">${s.location ? esc(s.location) + ' · ' : ''}${s.duration_min ? s.duration_min + ' min · ' : ''}${s.athlete_ids.map(id => esc(prof(id)?.name?.split(' ')[0] || '?')).join(', ')}</div></div>

}
function renderReports(){

function trickBlock(list, o={}){
  const disc = list[0].discipline;
  const rates = critRates(list, disc);
  const tagCount = {};
  list.filter(a => a.fell).forEach(a => parseTags(a.note).forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
  const bars = list.map((a, i) => ({v:qa(a), red:a.fell, col: outcomeOf(a)==='stomped' ? '#148FA0' : null, label:String(i + 1), title:`#${i + 1} · ${a.fell ? 'fall / miss' : a.score + '/' + a.max} · ${new Date(a.created_at).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'})}`}));
  return `<div class="trick-block">
    <div class="row" style="gap:8px"><b style="color:var(--char)">${esc(o.title || list[0].label)}</b><span class="grow"></span>
      <span class="chip">${list.length} att.</span>${qChip(avg(list.map(qa)))}<span class="chip">${landedPct(list)}% landed</span><span class="chip teal">${list.filter(a => outcomeOf(a)==='stomped').length} ⭐</span></div>
    <div class="chips" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px">${rates.map(r => `<span class="chip ${r.pct>=70?'green':r.pct>=50?'gold':'red'}">${esc(r.name.replace(/ \(.*\)/,''))} ${r.pct}%</span>`).join('')}</div>
    ${Object.keys(tagCount).length ? `<div class="chips" style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px"><span class="tiny muted" style="align-self:center">Fail reasons:</span>${Object.entries(tagCount).sort((a,b) => b[1]-a[1]).map(([t, n]) => `<span class="chip red">${esc(t)} ${n}×</span>`).join('')}</div>` : ''}
    ${barChart(bars, {line:true, h:170, xTitle:'Attempts (dashed = running Ø) · teal = stomped'})}
    <details class="noprint"><summary>Attempts</summary><div class="list">${list.slice().reverse().map(a => attemptRow(a, {noName:true})).join('')}</div></details>
  </div>`;
}

        ${s.results?.[id] ? (r => `<div class="rule" style="margin:0 0 12px">🏆 ${r.quali?.some(x => x != null) ? 'Quali ' + r.quali.filter(x => x != null).join(' / ') : ''}${r.final?.some(x => x != null) ? ' · Final ' + r.final.filter(x => x != null).join(' / ') : ''}${r.rank ? ` · <b>Rank ${r.rank}</b>` : ''}</div>`)(s.results[id]) : ''}

async function deleteReport(id){

  try { await Store.deleteSession(id); ST.sessions = ST.sessions.filter(s => s.id!==id); ST.attempts = ST.attempts.filter(a => a.session_id!==id); ST.rep.sel = null; toast('Report deleted'); render(); }
  catch (err){ toast('Could not delete: ' + (err.message||err), true); }
}

/* ══════════════════════════════════════════════════════════════════════
   MONITORING — aufgebaut wie im Snowboard: Team → Athlet:in → Trick
   Hauptmetrik Stomp-Rate (alle Kriterien erfüllt), dazu Landed-Rate,
   Kriterien-Erfüllung, Fail-Gründe, Verlauf über Sessions, Coaching Analysis.
   ══════════════════════════════════════════════════════════════════════ */
const MON_ST = {ready:{c:'#3E8E5A', l:'Ready'}, building:{c:'#C96A1F', l:'Building'}, critical:{c:'#D64545', l:'Critical'}, lowdata:{c:'#8a8a8f', l:'Low data'}};
const OC = {stomped:'#148FA0', landed:'#3E8E5A', failed:'#D64545', volume:'#396FA8'};
const MON_DIR_COL = {'Left':'#148FA0', 'Right':'#396FA8', 'Switch Left':'#8E5BB8', 'Switch Right':'#C96A1F', 'Forward':'#1F9E93', 'Switch':'#B08D1E', 'Rails':'#3E3E3F', 'Basics':'#6b6b70', 'Other':'#8a8a8f'};
const MON_DIR_ORDER = ['Left','Right','Switch Left','Switch Right','Forward','Switch','Rails','Basics','Other'];
const MON_PLATEAU_TOL = 5;
const monStatus = (n, s) => n < 5 ? 'lowdata' : s / n >= .7 ? 'ready' : s / n >= .4 ? 'building' : 'critical';
const monCounts = list => { const c = {n:list.length, s:0, l:0, f:0}; list.forEach(a => { const o = outcomeOf(a); if (o==='stomped') c.s++; else if (o==='landed') c.l++; else c.f++; }); return c; };
const pctR = (a, b) => b ? Math.round(a / b * 100) : 0;
function monDir(a){
  const t = a.trick || {};
  if (a.discipline==='Rail') return 'Rails';
  if (a.discipline==='Halfpipe') return t.kind==='basic' ? 'Basics' : ((t.sw ? 'Switch ' : '') + (SIDE[t.dir] || '')).trim() || 'Other';
  return DIRN[t.dir] || 'Other';
}
function monBounds(){
  const m = ST.mon, d = new Date(), y = d.getMonth() >= 4 ? d.getFullYear() : d.getFullYear() - 1;   // Saison ab 1. Mai
  if (m.period==='season') return [`${y}-05-01`, ''];
  if (m.period==='last') return [`${y-1}-05-01`, `${y}-04-30`];
  if (m.period==='custom') return [m.from || '', m.to || ''];
  return ['', ''];
}
function monPeriodLabel(){
  const m = ST.mon;
  const p = m.period==='season' ? 'current season' : m.period==='last' ? 'last season' : m.period==='all' ? 'all time' : `${m.from ? fmtDate(m.from) : '…'} – ${m.to ? fmtDate(m.to) : '…'}`;
  return p + (m.typ ? ` · ${m.typ}` : '');
}
function monAttempts(){
  const vis = visibleAthleteIds(ST.me, ST.profiles), [from, to] = monBounds(), typ = ST.mon.typ;
  return ST.attempts.filter(a => vis.has(a.athlete_id) && (!from || sessDate(a) >= from) && (!to || sessDate(a) <= to)
    && (!typ || normType(sessById(a.session_id)?.type)===typ));
}
// Sessions = Trainingstage (wie Snowboard), aufsteigend
function monDates(list){ return [...new Set(list.map(sessDate))].sort(); }
function monTrend(list, hit){
  const dates = monDates(list); if (dates.length < 2) return null;
  const rate = d => { const l = list.filter(a => sessDate(a)===d); return l.filter(hit).length / l.length; };
  const last = rate(dates[dates.length - 1]), prev = dates.slice(-4, -1).map(rate);
  const diff = last - prev.reduce((a, b) => a + b, 0) / prev.length;
  return {dir: diff >= .05 ? 'up' : diff <= -.05 ? 'down' : 'flat', diff: Math.round(diff * 100)};
}
function monTrendHtml(t){
  if (!t) return '<span class="muted">–</span>';
  if (t.dir==='up') return `<span style="color:${OC.landed};font-weight:700">↗ rising, +${t.diff}%</span>`;
  if (t.dir==='down') return `<span style="color:${OC.failed};font-weight:700">↘ falling, ${t.diff}%</span>`;
  return '<span class="muted" style="font-weight:600">→ stable</span>';
}
const isStomp = a => outcomeOf(a)==='stomped', isLanded = a => !a.fell;
function monRing(pct, color, size=92, stroke=9){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#ece8e6" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.max(0, Math.min(1, pct)))}"/></svg>`;
}
function monDonut(s, l, f, size=130){
  const n = s + l + f || 1, stroke = 14, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let off = 0, segs = '';
  for (const [v, col] of [[s, OC.stomped], [l, OC.landed], [f, OC.failed]]){
    if (!v) continue; const fr = v / n;
    segs += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-dasharray="${fr*c} ${c - fr*c}" stroke-dashoffset="${-off*c}"/>`;
    off += fr;
  }
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#ece8e6" stroke-width="${stroke}"/>${segs}</svg>`;
}
function monSetPeriod(v){ ST.mon.period = v; renderMonitoring(); }
function monSetTyp(v){ ST.mon.typ = v; renderMonitoring(); }
function monBack(){ ST.mon.view = ST.mon.view==='trick' ? 'athlete' : 'team'; renderMonitoring(); window.scrollTo({top:0}); }
function monOpenAthlete(id){ Object.assign(ST.mon, {view:'athlete', athleteId:id}); renderMonitoring(); window.scrollTo({top:0}); }
function monOpenTrick(i){ Object.assign(ST.mon, {view:'trick', key:MON_KEYS[i]}); renderMonitoring(); window.scrollTo({top:0}); }
let MON_KEYS = [];
function monHeader(title, sub, back){
  const m = ST.mon;
  const chip = (v, l) => `<button class="typechip ${m.typ===v?'on':''}" onclick="monSetTyp(${esc(JSON.stringify(v))})">${esc(l)}</button>`;
  return `<div class="mon-head">
    <div class="row" style="gap:12px">${back ? '<button class="btn ghost sm" onclick="monBack()">← Back</button>' : ''}
      <div class="grow"><div class="mon-title">${esc(title)}</div><div class="muted small">${sub}</div></div>
      <select style="width:auto" onchange="monSetPeriod(this.value)">${opts([['season','Current season'],['last','Last season'],['all','All time'],['custom','Custom period…']], m.period)}</select></div>
    ${m.period==='custom' ? `<div class="row" style="margin-top:10px;gap:8px"><input type="date" value="${m.from||''}" onchange="ST.mon.from=this.value;renderMonitoring()" style="width:auto"> – <input type="date" value="${m.to||''}" onchange="ST.mon.to=this.value;renderMonitoring()" style="width:auto"></div>` : ''}
    <div class="typechips">${chip('', 'All')}${SESS_TYPES.map(([t]) => chip(t, t)).join('')}</div>
  </div>`;
}
// Trick-Aggregation pro Kern-Trick (Grab-Varianten zusammengefasst)
function monTrickAgg(list){
  const by = {};
  list.forEach(a => { const c = coreOf(a); (by[c.key] ||= {key:c.key, label:c.label, disc:a.discipline, dir:monDir(a), rot:+(a.trick?.rot)||0, list:[]}).list.push(a); });
  return Object.values(by);
}

function renderMonitoring(){
  const root = $('#page-monitoring'), m = ST.mon, all = monAttempts();
  if (m.view==='trick' && !(prof(m.athleteId) && m.key)) m.view = prof(m.athleteId) ? 'athlete' : 'team';
  if (m.view==='athlete' && !prof(m.athleteId)) m.view = 'team';
  if (m.view==='team') return renderMonTeam(root, all);
  if (m.view==='athlete') return renderMonAthlete(root, all);
  return renderMonTrick(root, all);
}

function renderMonTeam(root, all){
  const aths = [...visibleAthleteIds(ST.me, ST.profiles)].map(prof).filter(Boolean).sort((a,b) => a.name.localeCompare(b.name));
  const groups = [...ST.groups.filter(g => aths.some(a => a.group_id===g.id)), ...(aths.some(a => !a.group_id) ? [{id:null, name:'No group yet'}] : [])];
  const tile = a => {
    const l = all.filter(x => x.athlete_id===a.id), c = monCounts(l), st = monStatus(c.n, c.s);
    const cnt = {ready:0, building:0, critical:0};
    monTrickAgg(l).forEach(t => { const k = monCounts(t.list), s = monStatus(k.n, k.s); if (cnt[s] != null) cnt[s]++; });
    return `<div class="mon-tile" onclick="monOpenAthlete('${a.id}')">
      <div class="row" style="gap:10px;flex-wrap:nowrap"><span class="avatar sm">${initials(a.name)}</span><div style="min-width:0"><div class="t">${esc(a.name)}</div><div class="tiny muted">${a.level || '–'}${a.gender ? ' · ' + a.gender : ''}</div></div></div>
      <div class="ringwrap">${monRing(c.n ? c.s / c.n : 0, MON_ST[st].c)}<div class="ringlbl"><b>${c.n ? pctR(c.s, c.n) + '%' : '—'}</b><span>stomp rate</span></div></div>
      <div class="tri"><div><b style="color:${MON_ST.ready.c}">${cnt.ready}</b><span>Ready</span></div><div><b style="color:${MON_ST.building.c}">${cnt.building}</b><span>Building</span></div><div><b style="color:${MON_ST.critical.c}">${cnt.critical}</b><span>Critical</span></div></div>
      <div class="more">View details →</div></div>`;
  };
  root.innerHTML = `<div class="card">${monHeader('Team Monitoring', `${all.length} attempts · ${monPeriodLabel()}`, false)}
    <div class="tiny muted" style="margin:14px 0 4px">Trick status: ≥70% stomp rate = <b>Ready</b> · 40–69% = <b>Building</b> · &lt;40% = <b>Critical</b> · fewer than 5 attempts = Low data. Stomped = all criteria met.</div>
    ${groups.map(g => { const list = aths.filter(a => (a.group_id || null)===g.id);
      return `<div class="sec-lbl">${esc(g.name)}</div><div class="mon-tiles">${list.map(tile).join('')}</div>`; }).join('') || '<div class="empty">No athletes.</div>'}
    <div class="row" style="justify-content:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)">
      <button class="btn ghost sm" style="border-color:#C96A1F;color:#C96A1F;background:#FAEEDF" onclick="realityCheck()">🔍 Reality Check</button>
      <button class="btn ghost sm" onclick="teamPdf()">📄 Team PDF</button></div>
  </div>`;
}

function renderMonAthlete(root, all){
  const ath = prof(ST.mon.athleteId), mine = all.filter(a => a.athlete_id===ath.id), c = monCounts(mine);
  const tricks = monTrickAgg(mine);
  MON_KEYS = tricks.map(t => t.key);
  const byDir = {};
  mine.forEach(a => { const d = monDir(a); byDir[d] = (byDir[d] || 0) + 1; });

    const k = monCounts(t.list), st = monStatus(k.n, k.s), i = MON_KEYS.indexOf(t.key);

        <div class="mini">Total <b>${k.n}</b><br><span style="color:${OC.stomped}">Stomped <b>${k.s}</b></span><br><span style="color:${OC.landed}">Landed <b>${k.l}</b></span><br><span style="color:${OC.failed}">Fail <b>${k.f}</b></span></div></div>
      <div class="row tiny" style="margin-top:8px">${monTrendHtml(monTrend(t.list, isStomp))}<span class="grow"></span><b style="color:${MON_ST[st].c}">${MON_ST[st].l}</b></div></div>`;

      <div class="dirbar">${dirs.map(d => `<i style="width:${byDir[d] / c.n * 100}%;background:${MON_DIR_COL[d]}" title="${esc(d)}"></i>`).join('')}</div>
      <div class="legend" style="margin-top:8px">${dirs.map(d => `<span><i class="dot" style="background:${MON_DIR_COL[d]}"></i>${esc(d)} <b style="color:${MON_DIR_COL[d]}">${pctR(byDir[d], c.n)}%</b></span>`).join('')}</div></div>` : '<div class="empty">No session data in this period.</div>'}
    ${MON_DIR_ORDER.map(d => { const ts = tricks.filter(t => t.dir===d).sort((a,b) => b.rot - a.rot || b.list.length - a.list.length); if (!ts.length) return '';

function monCritRates(list, disc){
  const rows = list.filter(a => !a.fell && a.crit);

}
function renderMonTrick(root, all){

  root.innerHTML = `<div class="card">${monHeader(label, esc(ath.name), true)}</div>
    <div class="card">
      <div class="row" style="justify-content:flex-end">${badge}</div>
      <div class="row" style="gap:22px;align-items:center;flex-wrap:wrap">
        <div class="ringwrap" style="width:130px;height:130px">${monDonut(c.s, c.l, c.f)}<div class="ringlbl"><b style="font-size:26px">${c.n}</b><span>attempts</span></div></div>
        <table class="legtbl">

          <tr><td><i class="sq" style="background:${OC.landed}"></i>Landed</td><td><b>${c.l}</b></td></tr>
          <tr class="bb"><td><i class="sq" style="background:${OC.failed}"></i>Failed</td><td><b>${c.f}</b></td></tr>
          <tr><td>Landed rate (Landed+Stomped)</td><td><b style="color:${OC.landed}">${pctR(c.s + c.l, c.n)}%</b> ${monTrendHtml(monTrend(list, isLanded))}</td></tr>
          <tr><td>Stomp rate</td><td><b style="color:${MON_ST[st].c}">${pctR(c.s, c.n)}%</b> ${monTrendHtml(monTrend(list, isStomp))}</td></tr>
        </table>
      </div>
      <div class="sub-h">Criteria fulfillment (Landed + Stomped)</div>
      <div class="chips-row">${cr.n ? cr.rates.map(r => { const col = r.pct >= 80 ? MON_ST.ready.c : r.pct >= 50 ? '#C96A1F' : MON_ST.critical.c; return `<span class="pill" style="border-color:${col};color:${col}">${esc(r.name.replace(/ \(.*\)/, ''))} ${r.pct}%</span>`; }).join('') : '<span class="muted small">No landed attempts yet.</span>'}</div>
      <div class="small" style="margin-top:12px">${top ? `Most common fail reason: <b>${esc(top[0])}</b> (${top[1]}×)${failTrend}` : fails.length ? `${fails.length} failed attempt${fails.length>1?'s':''} without reason` : 'No failed attempts.'}</div>

    </div>
    <div class="card"><h2>Progress over sessions</h2>
      <div class="legend"><span><i class="sq" style="background:${OC.volume};opacity:.6"></i>Volume (attempts)</span><span><i class="ln" style="background:${OC.landed}"></i>Landed rate (Landed+Stomped)</span><span><i class="ln dash" style="border-color:#C96A1F"></i>Stomp rate</span></div>
      ${monTimeChart(list)}
      <div class="tiny muted" style="margin-top:6px">⚠ Sessions with fewer than 5 attempts — rates are statistically weak.</div>

  MONC.hist = false; loadMonComments();

function monTimeChart(list){
  const dates = monDates(list).slice(-12);
  const H = 120, slot = 46, barW = 26, PAD = 38, W = PAD + dates.length * slot + 10;
  const yOf = p => 10 + (H - 10) * (1 - p / 100);
  const per = dates.map(d => { const l = list.filter(a => sessDate(a)===d), k = monCounts(l); return {d, k, lr:pctR(k.s + k.l, k.n), sr:pctR(k.s, k.n)}; });
  const maxN = Math.max(1, ...per.map(p => p.k.n));
  let s = '';
  for (const t of [0, 25, 50, 75, 100]) s += `<line x1="${PAD}" x2="${W}" y1="${yOf(t)}" y2="${yOf(t)}" stroke="#e2ddda" ${t ? 'stroke-dasharray="2 4"' : ''}/><text x="${PAD - 5}" y="${yOf(t) + 3}" text-anchor="end" font-size="9" fill="#6b6b70">${t}%</text>`;
  per.forEach((p, i) => {
    const cx = PAD + i * slot + slot / 2, h = Math.max(6, p.k.n / maxN * (H - 10));
    s += `<rect x="${cx - barW/2}" y="${H - h}" width="${barW}" height="${h}" rx="3" fill="${OC.volume}" opacity="${.3 + .55 * p.k.n / maxN}" style="cursor:pointer" onclick="monTimeSel('${p.d}')"><title>${fmtDate(p.d)}: ${p.k.n} attempts</title></rect>`;
    s += `<text x="${cx}" y="${H - h - 4}" text-anchor="middle" font-size="9" fill="${OC.volume}">${p.k.n}</text>`;
    s += `<text x="${cx}" y="${H + 14}" text-anchor="middle" font-size="9.5" fill="${p.k.n < 5 ? '#C96A1F' : '#6b6b70'}">${fmtShort(p.d)}.${p.k.n < 5 ? ' ⚠' : ''}</text>`;
  });
  if (per.length >= 2){
    const pts = k => per.map((p, i) => `${PAD + i * slot + slot / 2},${yOf(p[k])}`).join(' ');
    s += `<polyline fill="none" stroke="${OC.landed}" stroke-width="2" points="${pts('lr')}"/><polyline fill="none" stroke="#C96A1F" stroke-width="2" stroke-dasharray="4 3" points="${pts('sr')}"/>`;
  }
  s += `<text x="${PAD + (W - PAD) / 2}" y="${H + 30}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b6b70">Sessions</text>`;
  return `<div class="chart"><svg width="${W}" height="${H + 36}" viewBox="0 0 ${W} ${H + 36}">${s}</svg></div>`;
}
function monTrickList(){ const all = monAttempts(); return all.filter(a => a.athlete_id===ST.mon.athleteId && coreOf(a).key===ST.mon.key); }
function monTimeSel(d){
  const l = monTrickList().filter(a => sessDate(a)===d), k = monCounts(l);
  $('#mon-time-detail').innerHTML = `<b>${fmtDate(d)}</b> — ${k.n} attempts · <span style="color:${OC.stomped}">${k.s} stomped</span> · <span style="color:${OC.landed}">${k.l} landed</span> · <span style="color:${OC.failed}">${k.f} failed</span> · <b>${pctR(k.s, k.n)}%</b> stomp rate
    <button class="btn ghost sm" style="margin-left:8px" onclick="monOpenSession('${d}')">Open session view →</button>`;
}
function monOpenSession(d){
  const l = monTrickList().filter(a => sessDate(a)===d).sort((a,b) => a.created_at.localeCompare(b.created_at));
  const k = monCounts(l), mx = maxFor(l[0].discipline);
  const H = 90, slot = 30, PAD = 34, W = PAD + l.length * slot + 10, yOf = v => 8 + (H - 8) * (1 - v);
  let s = '';
  for (const [v, t] of [[0, '0★'], [Math.round(mx / 2) / mx, Math.round(mx / 2) + '★'], [1, mx + '★']]) s += `<line x1="${PAD}" x2="${W}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="#e2ddda" ${v ? 'stroke-dasharray="2 4"' : ''}/><text x="${PAD - 5}" y="${yOf(v) + 3}" text-anchor="end" font-size="9" fill="#6b6b70">${t}</text>`;
  let run = 0; const pts = [];
  l.forEach((a, i) => {
    const cx = PAD + i * slot + slot / 2, o = outcomeOf(a), v = a.fell ? 0 : a.score / (a.max || mx);
    if (o==='stomped') run++;
    pts.push(`${cx},${yOf(run / (i + 1))}`);
    const h = a.fell ? 6 : Math.max(4, v * (H - 8));
    s += `<rect x="${cx - 9}" y="${H - h}" width="18" height="${h}" rx="3" fill="${a.fell ? OC.failed : o==='stomped' ? OC.stomped : OC.landed}"><title>#${i + 1} · ${a.fell ? 'Failed' + (parseTags(a.note).length ? ': ' + parseTags(a.note).join(', ') : '') : a.score + '/' + (a.max || mx)}</title></rect>`;
    s += `<text x="${cx}" y="${H + 13}" text-anchor="middle" font-size="9" font-weight="${a.fell ? 800 : 400}" fill="${a.fell ? OC.failed : '#6b6b70'}">${i + 1}</text>`;
  });
  if (l.length > 1) s += `<polyline fill="none" stroke="#9a9396" stroke-width="1.8" points="${pts.join(' ')}"/>`;
  const tags = {}; l.filter(a => a.fell).forEach(a => parseTags(a.note).forEach(t => tags[t] = (tags[t] || 0) + 1));
  const topT = Object.entries(tags).sort((a,b) => b[1] - a[1])[0];
  modal(`<div class="row"><div class="grow"><h3>${esc(coreOf(l[0]).label)}</h3><div class="muted small">${esc(prof(ST.mon.athleteId)?.name)} · Session ${fmtDate(d)}</div></div><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
    <div class="legend" style="margin-top:12px"><span><i class="sq" style="background:${OC.landed}"></i>Landed / <i class="sq" style="background:${OC.stomped}"></i>Stomped (height = criteria met)</span><span><i class="sq" style="background:${OC.failed}"></i>Failed</span><span><i class="ln" style="background:#9a9396"></i>running stomp rate</span></div>
    <div class="chart"><svg width="${W}" height="${H + 30}" viewBox="0 0 ${W} ${H + 30}">${s}<text x="${PAD + (W - PAD) / 2}" y="${H + 27}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b6b70">Attempts</text></svg></div>
    <div class="small" style="margin:8px 0 4px">${k.s} stomped · ${k.l} landed · ${k.f} failed · <b>${pctR(k.s, k.n)}%</b> stomp rate${topT ? ` · ✗ mostly: ${esc(topT[0])} (${topT[1]}×)` : ''}</div>
    <div class="list">${l.map(a => attemptRow(a, {noName:true})).join('')}</div>`);
}

// Coaching Analysis — 6 Regeln wie Snowboard, «KPIs» = unsere Kriterien
function monCoaching(list, disc){
  const dates = monDates(list), nS = dates.length, GREY = '#8a8a8f', AMBER = '#C96A1F', RED = '#D64545';
  const inD = ds => list.filter(a => ds.includes(sessDate(a)));
  const srOf = d => { const l = inD([d]); return l.filter(isStomp).length / l.length; };
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const critOk = ds => { const r = monCritRates(inD(ds), disc); return r.n > 0 && r.rates.every(x => x.pct >= 80); };
  const items = [];
  // 1 Comp-readiness
  if (nS < 3) items.push(['Comp-readiness', `Not enough data (${nS}/3 sessions)`, GREY]);
  else if (critOk(dates.slice(-3))) items.push(['Comp-readiness', 'Reached', GREY]);
  else if (nS >= 4 && critOk(dates.slice(Math.max(0, nS - 6), nS - 3))) items.push(['Comp-readiness', 'Lost — was reached before', RED]);
  else items.push(['Comp-readiness', 'Not reached', AMBER]);
  // 2 Efficiency trend (Stomp-Rate)
  if (nS < 4) items.push(['Efficiency trend', `Not enough data (${nS}/4 sessions)`, GREY]);
  else { const d = Math.round((mean(dates.slice(-3).map(srOf)) - mean(dates.slice(Math.max(0, nS - 6), nS - 3).map(srOf))) * 100);
    items.push(['Efficiency trend', d <= -5 ? `Falling, ${d}% (3 sessions)` : d >= 5 ? `Rising, +${d}% (3 sessions)` : 'Stable (3 sessions)', d <= -5 ? RED : GREY]); }
  // 3 Volume effect
  if (nS < 3) items.push(['Volume effect', `Not enough data (${nS}/3 sessions)`, GREY]);
  else { const vol = dates.map(d => inD([d]).length), av = mean(vol), sa = mean(dates.map(srOf));
    const k = dates.filter((d, i) => vol[i] > 1.5 * av && srOf(d) < sa).length;
    items.push(['Volume effect', k ? `Drops at high volume, cause unclear (${k}×)` : 'No volume effect', k ? AMBER : GREY]); }
  // 4 Plateau
  if (nS < 3) items.push(['Plateau', `Not enough data (${nS}/3 sessions)`, GREY]);
  else { const r3 = dates.slice(-3).map(d => srOf(d) * 100), range = Math.max(...r3) - Math.min(...r3);
    items.push(['Plateau', range < MON_PLATEAU_TOL ? `Flat over last 3 sessions (±${Math.round(range)}%)` : 'None, still moving', range < MON_PLATEAU_TOL ? AMBER : GREY]); }
  // 5 Consistency
  if (nS < 3) items.push(['Consistency', `Not enough data (${nS}/3 sessions)`, GREY]);
  else { const r6 = dates.slice(-6).map(d => srOf(d) * 100), m = mean(r6), sd = Math.sqrt(mean(r6.map(x => (x - m) ** 2)));
    items.push(['Consistency', sd > 15 ? 'Irregular, session to session' : 'Consistent', sd > 15 ? AMBER : GREY]); }
  // 6 Most common fail
  const last3 = inD(dates.slice(-3)), prev = inD(dates.slice(Math.max(0, nS - 6), Math.max(0, nS - 3)));
  const tc = {}; last3.filter(a => a.fell).forEach(a => parseTags(a.note).forEach(t => tc[t] = (tc[t] || 0) + 1));
  const top = Object.entries(tc).sort((a,b) => b[1] - a[1])[0];
  if (!top) items.push(['Most common fail', 'No fail pattern', GREY]);
  else {
    let tr = '', col = AMBER;
    if (prev.length >= 3){ const now = top[1] / last3.length, before = prev.filter(a => a.fell && parseTags(a.note).includes(top[0])).length / prev.length;
      if (now - before >= .05){ tr = ', increasing'; col = RED; } else if (before - now >= .05) tr = ', decreasing'; else tr = ', stable'; }
    items.push(['Most common fail', `${top[0]} (${top[1]}×)${tr}`, col]);
  }
  return `<div class="coach-grid">${items.map(([l, t, col]) => `<div style="border-left:3px solid ${col};padding-left:10px"><div class="tiny muted" style="font-weight:700;letter-spacing:.6px;text-transform:uppercase">${esc(l)}</div><div style="font-weight:600;color:var(--char);font-size:14px">${esc(t)}</div></div>`).join('')}</div>
    <div class="tiny muted" style="margin-top:12px">Basis: sessions = training days in the selected period. Comp-readiness = every criterion ≥ 80% in the last 3 sessions (landed attempts). Plateau tolerance ±${MON_PLATEAU_TOL}%.</div>`;
}

// Reality Check: Assessment ↔ Session-Daten (Ø Qualität) wie in der Freeski-App
let RC = null;
function realityCheck(){
  const all = monAttempts(), vis = [...visibleAthleteIds(ST.me, ST.profiles)].map(prof).filter(Boolean).sort((a,b) => a.name.localeCompare(b.name));
  const items = [];
  for (const ath of vis){
    for (const e of entriesOf(ath.id)){
      if (e.status==='rework') continue;
      const key = coreOf(e).key, l = all.filter(a => a.athlete_id===ath.id && coreOf(a).key===key), q = avg(l.map(qa));
      if (e.status!=='goal' && l.length >= 5 && q < 70) items.push({e, ath, dir:'down', n:l.length, q});
      if (e.status==='goal' && l.length >= 3 && q >= 70) items.push({e, ath, dir:'up', n:l.length, q});
    }
  }
  RC = {items, sel:new Set(items.map((_, i) => i)), q:''};
  renderRealityCheck();
}
function renderRealityCheck(){
  const shown = RC.items.map((it, i) => ({...it, i})).filter(it => !RC.q || it.ath.name.toLowerCase().includes(RC.q.toLowerCase()));
  const by = {}; shown.forEach(it => (by[it.ath.id] ||= []).push(it));
  modal(`<h3>Reality Check</h3><p class="lead" style="margin-top:6px">Assessment vs. session data (${monPeriodLabel()}). <b>↓ Goal</b>: learned trick with Ø quality below 70% (≥5 attempts). <b>↑ Learned</b>: goal with Ø quality 70%+ (≥3 attempts) — goes to the review inbox.</p>
    <div class="row" style="margin-bottom:10px"><input type="text" placeholder="Search athlete…" value="${esc(RC.q)}" oninput="RC.q=this.value;renderRealityCheck();setTimeout(()=>{const i=document.querySelector('.modal input[type=text]');i.focus();i.setSelectionRange(i.value.length,i.value.length)},0)" style="max-width:240px">
      <button class="btn ghost sm" onclick="RC.items.forEach((_, i) => RC.sel.add(i));renderRealityCheck()">✓ All</button><button class="btn ghost sm" onclick="RC.sel.clear();renderRealityCheck()">✗ None</button></div>
    ${Object.values(by).map(list => `<div class="sub-h">${esc(list[0].ath.name)}</div>${list.map(it => `<label class="rc-row"><input type="checkbox" ${RC.sel.has(it.i)?'checked':''} onchange="this.checked?RC.sel.add(${it.i}):RC.sel.delete(${it.i})">
        <span class="grow">${esc(it.e.label)}</span><span class="chip ${it.dir==='up'?'green':'gold'}">${it.dir==='up' ? '↑ Learned' : '↓ Goal'}</span><span class="tiny muted">Ø ${it.q}% · ${it.n} att.</span></label>`).join('')}`).join('') || '<div class="empty">Everything matches — no suggestions.</div>'}
    <div class="btnrow"><button class="btn red" ${RC.items.length ? '' : 'disabled'} onclick="applyRealityCheck()">Apply selected (${RC.sel.size})</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
}
async function applyRealityCheck(){
  let n = 0;
  try {
    for (const i of RC.sel){
      const {e, dir} = RC.items[i];
      const next = dir==='up' ? {...e, status:'pending', achieved_at:nowIso()} : {...e, status:'goal'};
      upsertLocal(await Store.saveEntry(ST.me, next)); n++;
    }
    closeModal(); toast(`${n} entr${n===1?'y':'ies'} updated`); render();
  } catch (err){ toast('Could not apply: ' + (err.message||err), true); }
}

   ══════════════════════════════════════════════════════════════════════ */
function modal(html){ $('#modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; document.body.style.overflow = 'hidden'; }
function closeModal(){ $('#modal-root').innerHTML = ''; document.body.style.overflow = ''; RV = null; }
document.addEventListener('keydown', e => { if (e.key==='Escape' && $('#modal-root').innerHTML) closeModal(); });

/* ══════════════════════════════════════════════════════════════════════
   LOGIN / START
   ══════════════════════════════════════════════════════════════════════ */
function gateShell(inner){
  return `<header><div class="hd"><div><h1>Skills-Check Freeski<span class="dot">.</span></h1><div class="sub">Trick Analyses Nachwuchs</div></div>
    <div class="brand">${document.querySelector('.brand svg').outerHTML}</div></div></header><div class="box">${inner}</div>`;
}
function showDemoGate(){
  const d = DemoStore.data;
  const card = p => `<button class="demo-user" onclick="demoLogin('${p.id}')"><span class="avatar r-${p.role}">${initials(p.name)}</span>
    <span><b>${esc(p.name)}</b><br><span class="muted small">${ROLE_LABEL[p.role]}${p.group_id?` · ${esc(d.groups.find(g => g.id===p.group_id)?.name)}`:''}${p.level?` · ${p.level}`:''}</span></span></button>`;
  const by = r => d.profiles.filter(p => p.role===r).map(card).join('');
  $('#gate').innerHTML = gateShell(`
    <div class="card"><h2>Demo — choose a view</h2><p class="lead">Nothing is saved to a server; data stays in this browser.</p>
      <div class="muted tiny" style="margin:6px 0">ATHLETES — see only themselves</div><div class="demo-users">${by('athlete')}</div>
      <div class="muted tiny" style="margin:16px 0 6px">COACHES — see their group</div><div class="demo-users">${by('coach')}</div>
      <div class="muted tiny" style="margin:16px 0 6px">DVLP / NACHWUCHS — see everyone</div><div class="demo-users">${by('dvlp')}</div>
      <div class="btnrow"><button class="btn ghost sm" onclick="if(confirm('Reset all demo data?')){DemoStore.reset();showDemoGate();toast('Demo data reset')}">Reset demo data</button></div></div>`);
  $('#gate').hidden = false; $('#app').hidden = true;
}
async function demoLogin(id){ await DemoStore.login(id); await startApp(); }

function showLoginGate(msg){
  $('#gate').innerHTML = gateShell(`
    <div class="card"><h2>Log in</h2>
      <div style="display:grid;gap:12px">
        <label class="f">E-mail<input type="email" id="lg-mail" autocomplete="username"></label>
        <label class="f">Password<input type="password" id="lg-pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
      </div>
      <div class="btnrow"><button class="btn red" onclick="doLogin()">Log in</button><button class="btn ghost" onclick="showResetGate()">Forgot password?</button></div>
      <div class="small" id="lg-msg" style="margin-top:10px;color:var(--red)">${esc(msg||'')}</div></div>`);
  $('#gate').hidden = false; $('#app').hidden = true;
}
async function doLogin(){
  try { await SupaStore.login($('#lg-mail').value.trim(), $('#lg-pw').value); await startApp(); }
  catch (err){ $('#lg-msg').textContent = 'Login failed: ' + (err.message||err); }
}
function showResetGate(){
  $('#gate').innerHTML = gateShell(`
    <div class="card"><h2>Reset password</h2>
      <p class="lead">We send you a code by e-mail. Enter it here together with your new password.</p>
      <div style="display:grid;gap:12px">
        <label class="f">E-mail<input type="email" id="rs-mail"></label>
        <button class="btn ghost" onclick="sendResetCode()">Send code</button>
        <label class="f">Code from the e-mail<input type="text" id="rs-code" inputmode="numeric" maxlength="10"></label>
        <label class="f">New password<input type="password" id="rs-pw" autocomplete="new-password"></label>
      </div>
      <div class="btnrow"><button class="btn red" onclick="doReset()">Set password</button><button class="btn ghost" onclick="showLoginGate()">Back</button></div>
      <div class="small" id="rs-msg" style="margin-top:10px"></div></div>`);
}
async function sendResetCode(){
  const { error } = await db.auth.resetPasswordForEmail($('#rs-mail').value.trim());
  $('#rs-msg').textContent = error ? 'Error: ' + error.message : 'Code sent — check your inbox.';
}
async function doReset(){
  const email = $('#rs-mail').value.trim();
  const v = await db.auth.verifyOtp({email, token:$('#rs-code').value.trim(), type:'recovery'});
  if (v.error){ $('#rs-msg').textContent = 'Code invalid: ' + v.error.message; return; }
  const u = await db.auth.updateUser({password:$('#rs-pw').value});
  if (u.error){ $('#rs-msg').textContent = 'Error: ' + u.error.message; return; }
  toast('Password saved'); await startApp();
}
function showSetPasswordGate(){
  $('#gate').innerHTML = gateShell(`
    <div class="card"><h2>Welcome! Choose your password</h2>
      <label class="f">New password<input type="password" id="sp-pw" autocomplete="new-password"></label>
      <div class="btnrow"><button class="btn red" onclick="doSetPassword()">Save & continue</button></div>
      <div class="small" id="sp-msg" style="margin-top:10px;color:var(--red)"></div></div>`);
  $('#gate').hidden = false; $('#app').hidden = true;
}
async function doSetPassword(){
  const { error } = await db.auth.updateUser({password:$('#sp-pw').value});
  if (error){ $('#sp-msg').textContent = error.message; return; }
  history.replaceState(null, '', location.pathname + location.search); await startApp();
}

async function logout(){ await Store.logout(); location.reload(); }

async function loadData(){
  const d = await Store.loadAll(ST.me);
  Object.assign(ST, {profiles:d.profiles, groups:d.groups, entries:d.entries, notes:d.notes, sessions:d.sessions||[], attempts:d.attempts||[]});
  const me = ST.profiles.find(p => p.id===ST.me.id); if (me) ST.me = me;
  const vis = visibleAthletes();
  if (ST.me.role==='athlete') ST.athleteId = ST.me.id;
  else if (!vis.some(a => a.id===ST.athleteId)) ST.athleteId = vis[0]?.id || null;
}

async function startApp(){
  try {
    ST.me = await Store.currentUser();
    if (!ST.me){ DEMO ? showDemoGate() : showLoginGate(); return; }
    await loadData();
  } catch (err){
    console.error(err);
    DEMO ? showDemoGate() : showLoginGate('Could not load your profile: ' + (err.message||err));
    return;
  }
  document.querySelectorAll('.page').forEach(p => p.innerHTML = '');
  $('#gate').hidden = true; $('#app').hidden = false;
  if (DEMO){ const b = $('#demo-bar'); b.hidden = false; b.innerHTML = `DEMO MODE — data stays in this browser <button onclick="Store.logout().then(()=>location.reload())">Switch user</button>`; }
  ST.page = isStaff() && activeSession() ? 'session' : 'assessment';
  render();
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !ST.me || DEMO || ST.form || RV || ST.page==='session') return;
  try { await loadData(); render(); } catch {}
});

(async function boot(){
  if (DEMO){ DemoStore.load(); await startApp(); return; }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const hash = location.hash;
  if (/type=(invite|recovery)/.test(hash)){
    await new Promise(r => setTimeout(r, 300)); // supabase-js liest das Token aus dem Hash
    showSetPasswordGate(); return;
  }
  await startApp();
})();
</script>
</body>
</html>
